<style>
  :host {
    display: block;
    color: #17213b;
    font: 14px/1.5 Arial, "PingFang SC", "Microsoft YaHei", sans-serif
  }

  * {
    box-sizing: border-box
  }

  button {
    font: inherit;
    cursor: pointer
  }

  h2 {
    font-size: 22px;
    margin: 0 0 7px
  }

  .muted {
    color: #7b8498
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px
  }

  .btn {
    background: #635bff;
    color: white;
    border: 0;
    border-radius: 11px;
    padding: 12px 17px;
    font-weight: 700
  }

  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    overflow: auto
  }

  .filters button {
    white-space: nowrap;
    background: #fff;
    border: 1px solid #e4e7ee;
    border-radius: 9px;
    padding: 9px 14px
  }

  .filters .active {
    color: #635bff;
    border-color: #bbb7ff
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #e8eaf0
  }

  th,
  td {
    text-align: left;
    padding: 16px;
    border-bottom: 1px solid #eef0f4
  }

  th {
    font-size: 12px;
    color: #7c8599;
    background: #fafbfc
  }

  .status {
    background: #e8f8f1;
    color: #16885f;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px
  }

  .nopay {
    background-color: rgba(255, 0, 0, 0.1);
    color: #f00;
  }

  .wait {
    background-color: #fff3dc;
    color: #a76800
  }

  th:nth-child(3),
  td:nth-child(3) {
    display: none
  }

  @media(min-width:700px) {
    h2 {
      font-size: 26px
    }

    th:nth-child(3),
    td:nth-child(3) {
      display: table-cell
    }
  }

</style>
<div class="head">
  <div>
    <h2>订单中心</h2><span class="muted">统一管理所有渠道订单</span>
  </div>
  <button class="btn" kniu@click="handleExportOrders" type="button">导出订单</button>
</div>
<div class="filters"><button class="active">全部 {{nopay + processing + completed}}</button><button>待付款 {{nopay}}</button><button>处理中 {{processing}}</button><button>已完成 {{completed}}</button></div>
<table>
  <thead>
    <tr>
      <th>订单编号</th>
      <th>客户</th>
      <th>商品</th>
      <th>金额</th>
      <th>状态</th>
    </tr>
  </thead>
  <tbody>
    <tr kniu:for="{{orders}}" kniu:key="*this">
      <td>{{item.number}}</td>
      <td>{{item.title}}</td>
      <td>{{item.content}}</td>
      <td>¥ {{item.pay}}</td>
      <td>
        <template kniu:if="{{item.status === '待付款'}}">
          <span class="status nopay">{{item.status}}</span>
        </template>
        <template kniu:elseif="{{item.status === '处理中'}}">
          <span class="status wait">{{item.status}}</span>
        </template>
        <template kniu:else>
          <span class="status">{{item.status}}</span>
        </template>
      </td>
    </tr>
  </tbody>
</table>
