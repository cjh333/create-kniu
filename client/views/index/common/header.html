<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/index/global.min.css");

  .logo {
    height: calc(50 / var(--kniu_vw));
    background-color: transparent;
  }

  .index_header_search {
    margin: 0 0 calc(16 / var(--kniu_vw));
    width: 100%;
    padding: 0 calc(16 / var(--kniu_vw));
  }

  @media (min-width: calc(1280px - 60px)) {
    .index_header_search {
      width: 220px;
      margin: 0 0 0 calc(16 / var(--kniu_vw));
      padding: 0;
    }
  }
</style>
<header class="kniu_web_head">
  <kniu-navbar :option="{{fixed:'top'}}">
    <template #brand>
      <a class="logo_wrap" href="#/">
        <kniu-image class="logo" :option="{{src:(logo)}}" />
      </a>
    </template>
    <template #default>
      <kniu-navbar-cells>
        <kniu-navbar-cell :option="{{route:'/'}}">首页</kniu-navbar-cell>
        <kniu-input class="kniu_dd_main index_header_search" :form="{{keyword}}" :option="{{name:'keyword',placeholder:'请输入文章标题'}}" @keydown.enter="searchList" @input="debouncedSearch">
          <template #append :option="{{labelWidth:'48px'}}">
            <kniu-btn :option="{{text:true,block:true,ariaLabel:'搜索'}}" @click="searchList">
              <kniu-icon :option="{{icon:'search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
      </kniu-navbar-cells>
    </template>
    <template #append>
      <kniu-navbar-cells>
        <kniu-navbar-cell :if="{{loggedIn}}" :option="{{route:'/article'}}">写文章</kniu-navbar-cell>
        <kniu-navbar-cell :if="{{!loggedIn}}" :option="{{route:'/login'}}">写文章</kniu-navbar-cell>
        <kniu-navbar-cell :if="{{!loggedIn}}" :option="{{route:'/register'}}">注册</kniu-navbar-cell>
        <kniu-navbar-cell :if="{{!loggedIn}}" :option="{{route:'/login'}}">登录</kniu-navbar-cell>
        <kniu-user-login :if="{{loggedIn}}" />
      </kniu-navbar-cells>
    </template>
  </kniu-navbar>
</header>
