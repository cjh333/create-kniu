<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/index/home.min.css");

  .index_advertise_img {
    background-color: transparent;
  }

  .index_article_link:hover {
    color: #333;
  }

  @media (min-width: calc(1280px - 60px)) {
    .kniu_web_body .kniu_container {
      width: calc(100vw - 320 / var(--kniu_vw) * 2);
    }
  }
</style>
<div class="kniu_web">
  <include src="./common/header.html" />
  <!-- 2.内容 -->
  <main class="kniu_web_body">
    <section class="index_cells">
      <div class="index_cell index_cell_1">
        <div class="kniu_container">
          <div class="index_group_1">
            <article class="index_wrap_11">
              <template :for="{{dailys}}" :key="id">
                <div class="index_item_11" style="background-color:rgba(0,0,0,.03);">
                  <div class="index_daily_group">
                    <p class="index_daily_title">({{today}}) 每日一句：</p>
                    <p class="index_daily_cn">{{item.cn}}</p>
                    <p class="index_daily_en">{{item.en}}</p>
                  </div>
                </div>
              </template>
              <kniu-input class="kniu_md_mt_15 kniu_md_main" :form="{{keyword}}" :option="{{name:'keyword',placeholder:'请输入文章标题'}}" @keydown.enter="searchList" @input="debouncedSearch">
                <template #append label-width="48px">
                  <kniu-btn block aria-label="搜索" :option="{{text:true}}" @click="searchList">
                    <kniu-icon :option="{{icon:'search'}}" />
                  </kniu-btn>
                </template>
              </kniu-input>
              <template :for="{{articles}}" :key="id">
                <div class="kniu_md_mt_15 index_item_11">
                  <div class="index_article_group">
                    <a class="kniu_md_diy_underline index_article_title_group" :option="{{articleId:item.id,onClick:toDetail}}" href="javascript:;">
                      <span class="index_article_title">{{item.title}}</span>
                    </a>
                    <div class="index_article_summary" :if="{{item.summary}}">
                      <a class="kniu_md_diy_underline" :option="{{articleId:item.id,onClick:toDetail}}" href="javascript:;">{{item.summary}}</a>
                    </div>
                    <dl class="index_article_info_group">
                      <dd class="index_article_info">
                        <a class="index_article_link" :option="{{roleId:item.publisher_role_id,onClick:toAbout}}" href="javascript:;">发布人：{{item.publisher}}</a>
                      </dd>
                      <dd class="index_article_info">发布于：{{item.create_time}}</dd>
                      <dd class="index_article_info">浏览次数：{{item.hits}}次</dd>
                      <dd class="index_article_info">点赞数：{{item.likes}}</dd>
                    </dl>
                  </div>
                </div>
              </template>
              <kniu-page-more class="kniu_md_mt_15" :option="{{pageMore}}" />
            </article>
            <article class="index_wrap_12">
              <div class="index_item_12">
                <template :if="{{loggedIn}}">
                  <div class="index_user_group">
                    <div class="index_user_wrap">
                      <div class="index_user_photo_group">
                        <kniu-image class="index_user_photo" src="{{photo}}" />
                      </div>
                      <p class="index_user_note">{{note}}</p>
                    </div>
                  </div>
                </template>
                <ul class="index_advertise_group{{!loggedIn ? ' kniu_md_mt_0' : ''}}">
                  <template :for="{{advertises}}" :key="id">
                    <template :if="{{item.isShow == 1}}">
                      <li class="index_advertise">
                        <a class="index_advertise_link" href="{{item.url}}" target="_blank">
                          <kniu-image class="index_advertise_img" src="{{item.img}}" />
                        </a>
                      </li>
                    </template>
                  </template>
                </ul>
              </div>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>
  <include src="./common/footer.html" />
</div>
