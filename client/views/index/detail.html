<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/index/detail.css");

  .detail_btn_group {
    justify-content: center;
  }

  .detail_btn_group kniu-like,
  .detail_btn_group kniu-btn {
    flex: 0 0 auto;
    width: 120px;
    min-width: 120px;
  }

  .detail_btn_group kniu-btn {
    height: 48px !important;
  }

  .detail_article_info {
    display: flex !important;
    justify-content: center !important;
    align-items: center;
    margin-top: calc(12 / var(--kniu_vw));
    gap: calc(20 / var(--kniu_vw));
    text-align: center;
    color: #a0a0a0 !important;
  }

  .detail_note {
    margin-top: calc(20 / var(--kniu_vw));
    line-height: 1.3;
    color: rgba(0, 0, 0, .2);
  }

  @media (min-width: calc(1024px - 60px)) {
    .detail_article_info {
      font-size: calc(13 / var(--kniu_vw));
    }

    .detail_note {
      font-size: calc(13 / var(--kniu_vw));
    }
  }

  @media (min-width: calc(1280px - 60px)) {
    .kniu_web_body .kniu_container {
      width: calc(100vw - 320 / var(--kniu_vw) * 2);
    }
  }
</style>
<div class="kniu_web">
  <include src="./common/header.html" />
  <!-- 2.内容 -->
  <main class="kniu_web_body">
    <section class="detail_cells">
      <div class="detail_cell detail_cell_1">
        <div class="kniu_container">
          <div class="detail_group_1">
            <div class="detail_title_group_1">
              <h1 class="detail_title_1">{{title}}</h1>
              <h4 class="detail_subtitle_1">{{subtitle}}</h4>
            </div>
            <div class="detail_article_info">
              <span>发布人：{{publisher}}</span>
              <span>发布于：{{create_time}}</span>
              <span>浏览次数：{{hits}}次</span>
              <span>点赞数：{{likeOptions.count}}</span>
            </div>
            <div kniu:class="{{content_mode === 'markdown' ? 'detail_content_1 kniu_markdown_body' : 'detail_content_1 kniu_richtext_body'}}">{{@content}}</div>
          </div>
          <div class="detail_note">
            声明：<br>
            © 著作权归作者所有，转载或内容合作请联系作者。<br>
            如果内容信息由AI辅助生成，浏览时请结合常识与多方信息审慎甄别。<br>
            平台声明：文章内容（如有图片或视频亦包括在内）由作者上传并发布，文章内容仅代表作者本人观点，本平台系信息发布平台，仅提供信息存储服务。
          </div>
          <div class="kniu_btn_group detail_btn_group" kniu:if="{{!isOwn}}">
            <kniu-like kniu:option="{{likeOptions}}" />
            <kniu-btn kniu:option="{{favoriteOptions}}" kniu@click="toggleFavorite">{{favoriteText}}</kniu-btn>
          </div>
          <kniu-article-tab class="kniu_md_mt_30" kniu:option="{{articleTabOptions}}" />
          <kniu-comment class="kniu_md_mt_30" kniu:option="{{commentOptions}}" />
        </div>
      </div>
      <div class="detail_cell detail_cell_2">
        <div class="kniu_container">
          <div class="kniu_btn_group detail_btn_group">
            <a class="kniu_btn detail_btn" kniu@click="toBack" href="#/">返回</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <include src="./common/footer.html" />
</div>
