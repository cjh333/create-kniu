<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");

  .profile_cells {
    padding: 16px;
  }

  .profile_card {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ebeef5;
    border-radius: 8px;
    background-color: #fff;
    box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
  }

  .profile_stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    margin: 22px 0;
    border: 1px solid #ebeef5;
    border-radius: 6px
  }

  .profile_stat {
    padding: 16px;
    text-align: center
  }

  .profile_stat+.profile_stat {
    border-top: 1px solid #ebeef5
  }

  .profile_stat_value {
    display: block;
    color: #303133;
    font-size: 22px;
    font-weight: 600
  }

  .profile_stat_label {
    display: block;
    margin-top: 6px;
    color: #909399;
    font-size: 13px
  }

  .profile_section_title {
    margin: 26px 0 14px;
    color: #303133;
    font-size: 16px
  }

  .profile_favorites {
    border-top: 1px solid #ebeef5
  }

  .profile_favorite {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    padding: 13px 4px;
    border: 0;
    border-bottom: 1px solid #ebeef5;
    background-color: transparent;
    color: #606266;
    text-align: left;
    cursor: pointer
  }

  .profile_favorite:hover {
    color: #409eff
  }

  .profile_favorite_time {
    flex-shrink: 0;
    color: #909399;
    font-size: 12px
  }

  .profile_empty {
    padding: 22px 0;
    color: #909399;
    text-align: center
  }

  .profile_field {
    display: flex;
    align-items: stretch;
    flex-direction: column;
    gap: 12px
  }

  .profile_field_label {
    flex: auto;
    color: #606266
  }

  .profile_field_value {
    color: #303133
  }

  .profile_signin {
    margin-top: 18px
  }

  .profile_back {
    margin-top: 28px;
    text-align: center
  }

  @media(min-width:601px) {
    .profile_cells {
      padding: 32px 0
    }

    .profile_card {
      padding: 28px
    }

    .profile_field {
      align-items: center;
      flex-direction: row;
      gap: 12px
    }

    .profile_field_label {
      flex: 0 0 72px
    }

    .profile_stats {
      grid-template-columns: repeat(4, 1fr)
    }

    .profile_stat+.profile_stat {
      border-top: 0;
      border-left: 1px solid #ebeef5
    }
  }
</style>
<div class="kniu_web">
  <include src="./common/header.html" />
  <main class="kniu_web_body">
    <section class="profile_cells">
      <div class="kniu_container">
        <div class="profile_card">
          <h2 class="profile_section_title kniu_md_mtb_0">个人中心</h2>
          <div class="profile_stats">
            <div class="profile_stat"><span class="profile_stat_value">{{articleLikeCount}}</span><span class="profile_stat_label">文章获赞数</span></div>
            <div class="profile_stat"><span class="profile_stat_value">{{commentLikeCount}}</span><span class="profile_stat_label">评论获赞数</span></div>
            <div class="profile_stat"><span class="profile_stat_value">{{commentCount}}</span><span class="profile_stat_label">评论数</span></div>
            <div class="profile_stat"><span class="profile_stat_value">{{favorites.length}}</span><span class="profile_stat_label">收藏文章</span></div>
          </div>
          <div class="profile_signin" :if="{{nickname === ''}}">
            <kniu-btn :option="{{type:'primary'}}" @click="toSignin">登录 / 注册</kniu-btn>
          </div>
          <h2 class="profile_section_title">收藏的文章</h2>
          <div class="profile_favorites">
            <template :for="{{favorites}}" :key="id">
              <button type="button" class="profile_favorite" :[article-id]="{{item.id}}" @click="toFavorite">
                <span>{{item.title}}</span><span class="profile_favorite_time">{{item.create_time}}</span>
              </button>
            </template>
            <div class="profile_empty" :if="{{favorites.length === 0}}">暂无收藏文章</div>
          </div>
          <h2 class="profile_section_title">浏览历史</h2>
          <div class="profile_favorites">
            <template :for="{{history}}" :key="id">
              <button type="button" class="profile_favorite" :[article-id]="{{item.id}}" @click="toFavorite">
                <span>{{item.title}}</span><span class="profile_favorite_time">{{item.last_view_time}}</span>
              </button>
            </template>
            <div class="profile_empty" :if="{{history.length === 0}}">暂无浏览记录</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <include src="./common/footer.html" />
</div>
