<style>
  @import url("@kniu/kniu.min.css");

  :host {
    display: block;
    width: 100%;
    min-height: 100vh;
    background-color: #667eea;
    background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }

  .login_group {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #667eea;
    background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
  }

  .login_group::before {
    content: "";
    position: fixed;
    top: -18%;
    right: -8%;
    width: 520px;
    height: 520px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    pointer-events: none
  }

  .login_group::after {
    content: "";
    position: fixed;
    bottom: -16%;
    left: -10%;
    width: 460px;
    height: 460px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    pointer-events: none
  }

  .login_wrap {
    width: 400px;
    max-width: 92vw;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    overflow: hidden
  }

  .login_header {
    padding: 36px 40px 8px;
    text-align: center
  }

  .login_brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px
  }

  .login_brandmark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background-color: #23262e;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    border-radius: 8px
  }

  .login_brandname {
    font-size: 22px;
    font-weight: 700;
    color: #23262e
  }

  .login_brandname strong {
    color: #667eea
  }

  .login_subtitle {
    font-size: 13px;
    color: #999;
    margin-top: 4px
  }

  .login_body {
    padding: 20px 40px 36px
  }

  .kniu_sys_login_form {
    display: block
  }

  .kniu_sys_login_captcha_image {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    overflow: hidden;
    border: 1px solid #dcdfe6;
    border-radius: 4px;
    background-color: #f5f7fa;
    color: #909399;
    font-size: 12px
  }

  .kniu_sys_login_captcha_image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer
  }

  .captcha_tip {
    margin: 20px 0 18px 72px;
    color: #909399;
    font-size: 12px
  }

  kniu-form[data-label-position="top"] .captcha_tip {
    margin-left: 0
  }

  .form_error {
    display: none;
    margin: 0 0 16px 72px;
    color: #f56c6c;
    font-size: 13px
  }

  .form_error.show {
    display: block
  }

  .login_btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 44px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background-color: #667eea;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color .2s, transform .1s
  }

  .login_btn:hover {
    background-color: #5a6fd6
  }

  .login_btn:active {
    transform: scale(.98)
  }

  .login_btn:disabled {
    background-color: #a0aec0;
    cursor: not-allowed;
    transform: none
  }

  .login_btn .kniu_btn_loading_spinner {
    display: none;
    border: 2px solid rgba(255, 255, 255, .3);
    border-top-color: #fff;
    border-radius: 50%;
    margin-right: 8px;
    width: 18px;
    height: 18px;
    animation: animate_spin .6s linear infinite;
  }

  .kniu_btn_loading .kniu_btn_loading_spinner {
    display: inline-block;
  }

  .kniu_btn_loading .login_btn_text {
    display: none;
  }

  @keyframes animate_spin {
    100% {
      transform: rotate(360deg);
    }
  }

  .login_footer {
    padding: 0 40px 28px;
    text-align: center;
    font-size: 12px;
    color: #bbb
  }

  @media (max-width: 480px) {

    .login_header,
    .login_body {
      padding-left: 24px;
      padding-right: 24px
    }
  }
</style>

<div class="login_group">
  <div class="login_wrap">
    <div class="login_header">
      <div class="login_brand">
        <span class="login_brandmark">K</span>
        <span class="login_brandname">Kniu<strong>System</strong></span>
      </div>
      <p class="login_subtitle">原生多应用工作台 · 管理后台</p>
    </div>
    <div class="login_body">
      <kniu-form ref="form" kniu:options="{{({...(loginModel)})}}" kniu@submit.prevent="onSubmit">
        <kniu-form-cell kniu:options="{{({label:'用户名'})}}">
          <kniu-input kniu:model="{{loginModel.username}}" kniu:options="{{({name:'username',placeholder:'请输入用户名'})}}" />
        </kniu-form-cell>
        <kniu-form-cell kniu:options="{{({label:'密码'})}}">
          <kniu-input kniu:model="{{loginModel.password}}" kniu:options="{{({name:'password',placeholder:'请输入密码',showPassword:true,type:'password'})}}" />
        </kniu-form-cell>
        <kniu-form-cell kniu:options="{{({label:'验证码'})}}">
          <kniu-input kniu:model="{{loginModel.gvcode}}" kniu:options="{{({name:'gvcode',placeholder:'请输入验证码',maxlength:'4'})}}" />
          <kniu-image style="border-radius:3px;margin-left:5px;min-width:120px;min-height:40px;cursor:pointer;" kniu:options="{{({src:(captchaImageUrl),fit:'contain'})}}" kniu@click="refreshCaptcha"/>
        </kniu-form-cell>
        <p class="captcha_tip">请输入图片中算术题的计算结果</p>
        <div class="kniu_btn_group">
          <kniu-btn kniu:options="{{({disabled:(isSubmitting),nativeType:'submit',block:true})}}">
            <kniu-icon kniu:if="{{isSubmitting}}" kniu:options="{{({icon:'Loading'})}}" />
            <template kniu:else>登 录</template>
          </kniu-btn>
        </div>
      </kniu-form>
    </div>
    <div class="login_footer">Kniu System &copy; 2026</div>
  </div>
</div>
