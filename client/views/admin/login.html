<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");

  :host {
    display: block;
    width: 100%;
    min-height: 100vh;
    background-color: #667eea;
    background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }

  .login_group {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 24px 0;
    overflow: auto;
    background-color: #667eea;
    background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  .login_group::before {
    content: "";
    position: fixed;
    top: -18%;
    right: -8%;
    width: 520px;
    height: 520px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .login_group::after {
    content: "";
    position: fixed;
    bottom: -16%;
    left: -10%;
    width: 460px;
    height: 460px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .login_wrap {
    width: 400px;
    max-width: 92vw;
    margin: auto;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    overflow: hidden;
  }

  .login_header {
    padding: 32px 24px 0;
    text-align: center;
  }

  .login_brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .login_brandmark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background-color: #23262e;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    border-radius: 8px;
  }

  .login_brandname {
    font-size: 22px;
    font-weight: 700;
    color: #23262e;
  }

  .login_brandname strong {
    color: #667eea;
  }

  .login_subtitle {
    font-size: 13px;
    color: #999;
    margin-top: 6px;
  }

  .login_tabs {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 20px;
    border-bottom: 1px solid #ebeef5;
  }

  .login_tab {
    position: relative;
    padding: 0 2px 12px;
    border: 0;
    background-color: transparent;
    color: #909399;
    font: 15px/1 var(--kniu-font-family);
    cursor: pointer;
  }

  .login_tab:hover {
    color: #667eea;
  }

  .login_tab[data-active="true"] {
    color: #23262e;
    font-weight: 600;
  }

  .login_tab[data-active="true"]::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 0;
    height: 2px;
    background-color: #667eea;
    border-radius: 2px;
  }

  .login_body {
    padding: 20px 24px 28px;
  }

  .login_pane {
    display: none;
  }

  .login_pane[data-active="true"] {
    display: block;
  }

  .kniu_sys_login_captcha_image {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    overflow: hidden;
    border: 1px solid #dcdfe6;
    border-radius: 4px;
    background-color: #f5f7fa;
    color: #909399;
    font-size: 12px;
  }

  .kniu_sys_login_captcha_image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }

  .login_footer {
    padding: 0 40px 26px;
    text-align: center;
    font-size: 12px;
    color: #bbb;
  }

  .login_footer a {
    color: #bbb;
    text-decoration: none;
  }

  .login_footer a:hover {
    color: #667eea;
  }

  .login_forgot {
    text-align: right;
    margin-top: 10px;
  }

  .login_forgot a {
    color: #667eea;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }

  .login_forgot a:hover {
    text-decoration: underline
  }

  .kniu_btn_group {
    display: flex;
    gap: 12px;
  }

  .kniu_btn_group>* {
    flex: 1;
  }

  .login_captcha {
    border-radius: 3px;
    margin-left: 5px;
    min-width: 120px;
    min-height: 28px;
    height: var(--kniu-control-height, max(28px, calc(40 / var(--kniu_vw))));
    cursor: pointer;
  }

  @media (min-width: 481px) {

    .login_header,
    .login_body {
      padding-left: 40px;
      padding-right: 40px;
    }
  }
</style>

<div class="login_group">
  <div class="login_wrap">
    <div class="login_header">
      <div class="login_brand">
        <span class="login_brandmark">K</span>
        <span class="login_brandname">Kniu<strong>System</strong></span>
      </div>
      <p class="login_subtitle">{{subtitle}}</p>
    </div>
    <div class="login_tabs" :if="{{tab !== 'reset'}}">
      <button type="button" class="login_tab" :[active]="{{tab === 'login'}}" @click="toLogin">登录</button>
      <button type="button" class="login_tab" :[active]="{{tab === 'register'}}" @click="toRegister">注册</button>
    </div>
    <div class="login_body" :style="{{tab === 'reset' ? 'margin-top:20px' : ''}}">
      <div class="login_pane" :[active]="{{tab === 'login'}}">
        <kniu-form :option="{{loginModel}}" @submit.prevent="onSubmit">
          <kniu-form-cell>
            <kniu-input :form="{{loginModel.username}}" :option="{{name:'username',placeholder:'请输入账号',maxlength:'30',clearable:true}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{loginModel.password}}" :option="{{name:'password',placeholder:'请输入密码',showPassword:true,type:'password'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{loginModel.gvcode}}" :option="{{name:'gvcode',placeholder:'计算结果',maxlength:'4'}}" />
            <kniu-image class="login_captcha" :option="{{src:(captchaImageUrl),fit:'cover'}}" @click="refreshCaptcha" />
          </kniu-form-cell>
          <div class="login_forgot">
            <a href="javascript:;" @click="toReset">忘记密码？</a>
          </div>
          <div class="kniu_btn_group">
            <kniu-btn :option="{{disabled:(isSubmitting),nativeType:'submit',block:true}}">登 录</kniu-btn>
            <kniu-btn :option="{{nativeType:'button',block:true}}" @click="toHome">返 回</kniu-btn>
          </div>
        </kniu-form>
      </div>
      <div class="login_pane" :[active]="{{tab === 'register'}}">
        <kniu-form :option="{{registerModel}}" @submit.prevent="onSubmit">
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.username}}" :option="{{name:'username',placeholder:'账号，2-30位中文/字母/数字',maxlength:'30'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.nickname}}" :option="{{name:'nickname',placeholder:'昵称，1-30位中文/字母/数字，仅用于展示',maxlength:'30'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.password}}" :option="{{name:'password',placeholder:'密码，8 位以上，含大小写字母、数字和特殊字符',showPassword:true,type:'password',tip:'• 8 位以上;• 含大写字母;• 含小写字母;• 含数字;• 含特殊字符'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.confirm}}" :option="{{name:'confirm',placeholder:'确认密码，请再次输入密码',showPassword:true,type:'password'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.email}}" :option="{{name:'email',placeholder:'邮箱，用于找回密码',maxlength:'190'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.email_code}}" :option="{{name:'email_code',placeholder:'邮箱验证码',maxlength:'6'}}" />
            <kniu-btn style="width:120px;margin-left:5px;" :option="{{disabled:(codeSending || codeCountdown > 0),nativeType:'button',block:true}}" @click="sendRegisterCode">{{codeCountdown > 0 ? codeCountdown + 's 后重试' : '发送验证码'}}</kniu-btn>
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{registerModel.gvcode}}" :option="{{name:'gvcode',placeholder:'计算结果',maxlength:'4'}}" />
            <kniu-image class="login_captcha" :option="{{src:(captchaImageUrl),fit:'cover'}}" @click="refreshCaptcha" />
          </kniu-form-cell>
          <div class="kniu_btn_group">
            <kniu-btn :option="{{disabled:(isSubmitting),nativeType:'submit',block:true}}">注 册</kniu-btn>
            <kniu-btn :option="{{nativeType:'button',block:true}}" @click="toHome">返 回</kniu-btn>
          </div>
        </kniu-form>
      </div>
      <div class="login_pane" :[active]="{{tab === 'reset'}}">
        <kniu-form :option="{{resetModel}}" @submit.prevent="onResetSubmit">
          <kniu-form-cell>
            <kniu-input :form="{{resetModel.username}}" :option="{{name:'username',placeholder:'注册时的账号',maxlength:'30',clearable:true}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{resetModel.email}}" :option="{{name:'email',placeholder:'请输入注册时填写的邮箱',maxlength:'190',clearable:true}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{resetModel.code}}" :option="{{name:'code',placeholder:'邮箱验证码',maxlength:'6'}}" />
            <kniu-btn style="width:120px;margin-left:5px;" :option="{{disabled:(codeSending || codeCountdown > 0),nativeType:'button',block:true}}" @click="sendResetCode">{{codeCountdown > 0 ? codeCountdown + 's 后重试' : '发送验证码'}}</kniu-btn>
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{resetModel.password}}" :option="{{name:'password',placeholder:'新密码，8 位以上，含大小写字母、数字和特殊字符',showPassword:true,type:'password',tip:'• 8 位以上;• 含大写字母;• 含小写字母;• 含数字;• 含特殊字符'}}" />
          </kniu-form-cell>
          <kniu-form-cell>
            <kniu-input :form="{{resetModel.confirm}}" :option="{{name:'confirm',placeholder:'确认新密码，请再次输入新密码',showPassword:true,type:'password'}}" />
          </kniu-form-cell>
          <div class="kniu_btn_group">
            <kniu-btn :option="{{disabled:(isSubmitting),nativeType:'submit',block:true}}">重置密码</kniu-btn>
            <kniu-btn :option="{{nativeType:'button',block:true}}" @click="toLogin">返 回</kniu-btn>
          </div>
        </kniu-form>
      </div>
    </div>
    <div class="login_footer">Copyright 2018-{{currentYear}} &copy;KniuSystem</div>
  </div>
</div>
