<style>
  @import url("@kniu/kniu.min.css");

  :host {
    display: block;
    width: 100%;
    min-height: 100vh;
    background-color: #667eea;
    background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }

  .login_group {
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: #667eea;
    background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%)
  }

  .login_group::before {
    content: "";
    position: fixed;
    top: -18%;
    right: -8%;
    width: 520px;
    height: 520px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    pointer-events: none
  }

  .login_group::after {
    content: "";
    position: fixed;
    bottom: -16%;
    left: -10%;
    width: 460px;
    height: 460px;
    background-image: radial-gradient(circle, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 70%);
    border-radius: 50%;
    pointer-events: none
  }

  .login_wrap {
    width: 400px;
    max-width: 92vw;
    margin: 24px 0;
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    overflow: hidden
  }

  .login_header {
    padding: 32px 40px 0;
    text-align: center
  }

  .login_brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px
  }

  .login_brandmark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background-color: #23262e;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    border-radius: 8px
  }

  .login_brandname {
    font-size: 22px;
    font-weight: 700;
    color: #23262e
  }

  .login_brandname strong {
    color: #667eea
  }

  .login_subtitle {
    font-size: 13px;
    color: #999;
    margin-top: 6px
  }

  .login_tabs {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 20px;
    border-bottom: 1px solid #ebeef5
  }

  .login_tab {
    position: relative;
    padding: 0 2px 12px;
    border: 0;
    background-color: transparent;
    color: #909399;
    font: 15px/1 Arial, "Microsoft YaHei", sans-serif;
    cursor: pointer
  }

  .login_tab:hover {
    color: #667eea
  }

  .login_tab[data-active="true"] {
    color: #23262e;
    font-weight: 600
  }

  .login_tab[data-active="true"]::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 0;
    height: 2px;
    background-color: #667eea;
    border-radius: 2px
  }

  .login_body {
    padding: 20px 40px 28px
  }

  .login_pane {
    display: none
  }

  .login_pane[data-active="true"] {
    display: block
  }

  .kniu_sys_login_captcha_image {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    overflow: hidden;
    border: 1px solid #dcdfe6;
    border-radius: 4px;
    background-color: #f5f7fa;
    color: #909399;
    font-size: 12px
  }

  .kniu_sys_login_captcha_image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer
  }

  .login_tip {
    margin: 14px 0 18px;
    color: #909399;
    font-size: 12px
  }

  .login_footer {
    padding: 0 40px 26px;
    text-align: center;
    font-size: 12px;
    color: #bbb
  }

  .login_footer a {
    color: #bbb;
    text-decoration: none
  }

  .login_footer a:hover {
    color: #667eea
  }

  @media (max-width: 480px) {

    .login_header,
    .login_body {
      padding-left: 24px;
      padding-right: 24px
    }
  }
</style>

<div class="login_group">
  <div class="login_wrap">
    <div class="login_header">
      <div class="login_brand">
        <span class="login_brandmark">K</span>
        <span class="login_brandname">Kniu<strong>System</strong></span>
      </div>
      <p class="login_subtitle">{{subtitle}}</p>
    </div>
    <div class="login_tabs">
      <button type="button" class="login_tab" kniu:[active]="{{tab === 'login'}}" kniu@click="toLogin">登录</button>
      <button type="button" class="login_tab" kniu:[active]="{{tab === 'register'}}" kniu@click="toRegister">注册</button>
    </div>
    <div class="login_body">
      <div class="login_pane" kniu:[active]="{{tab === 'login'}}">
        <kniu-form kniu:options="{{loginModel}}" kniu@submit.prevent="onSubmit">
          <kniu-form-cell kniu:options="{{({label:'账号'})}}">
            <kniu-input kniu:model="{{loginModel.username}}" kniu:options="{{({name:'username',placeholder:'请输入账号',maxlength:'30',clearable:true})}}" />
          </kniu-form-cell>
          <kniu-form-cell kniu:options="{{({label:'密码'})}}">
            <kniu-input kniu:model="{{loginModel.password}}" kniu:options="{{({name:'password',placeholder:'请输入密码',showPassword:true,type:'password'})}}" />
          </kniu-form-cell>
          <kniu-form-cell kniu:options="{{({label:'验证码'})}}">
            <kniu-input kniu:model="{{loginModel.gvcode}}" kniu:options="{{({name:'gvcode',placeholder:'计算结果',maxlength:'4'})}}" />
            <kniu-image style="border-radius:3px;margin-left:5px;min-width:120px;min-height:40px;cursor:pointer;" kniu:options="{{({src:(captchaImageUrl),fit:'contain'})}}" kniu@click="refreshCaptcha" />
          </kniu-form-cell>
          <p class="login_tip">请输入图片中算术题的计算结果</p>
          <div class="kniu_btn_group">
            <kniu-btn kniu:options="{{({disabled:(isSubmitting),nativeType:'submit',block:true})}}">登 录</kniu-btn>
          </div>
        </kniu-form>
      </div>
      <div class="login_pane" kniu:[active]="{{tab === 'register'}}">
        <kniu-form kniu:options="{{registerModel}}" kniu@submit.prevent="onSubmit">
          <kniu-form-cell kniu:options="{{({label:'账号'})}}">
            <kniu-input kniu:model="{{registerModel.username}}" kniu:options="{{({name:'username',placeholder:'2-30位中文/字母/数字',maxlength:'30',clearable:true})}}" />
          </kniu-form-cell>
          <kniu-form-cell kniu:options="{{({label:'密码'})}}">
            <kniu-input kniu:model="{{registerModel.password}}" kniu:options="{{({name:'password',placeholder:'6-20位非空白字符',showPassword:true,type:'password'})}}" />
          </kniu-form-cell>
          <kniu-form-cell kniu:options="{{({label:'确认密码'})}}">
            <kniu-input kniu:model="{{registerModel.confirm}}" kniu:options="{{({name:'confirm',placeholder:'请再次输入密码',showPassword:true,type:'password'})}}" />
          </kniu-form-cell>
          <kniu-form-cell kniu:options="{{({label:'验证码'})}}">
            <kniu-input kniu:model="{{registerModel.gvcode}}" kniu:options="{{({name:'gvcode',placeholder:'计算结果',maxlength:'4'})}}" />
            <kniu-image style="border-radius:3px;margin-left:5px;min-width:120px;min-height:40px;cursor:pointer;" kniu:options="{{({src:(captchaImageUrl),fit:'contain'})}}" kniu@click="refreshCaptcha" />
          </kniu-form-cell>
          <p class="login_tip">请输入图片中算术题的计算结果</p>
          <div class="kniu_btn_group">
            <kniu-btn kniu:options="{{({disabled:(isSubmitting),nativeType:'submit',block:true})}}">注 册</kniu-btn>
          </div>
        </kniu-form>
      </div>
    </div>
    <div class="login_footer"><a href="#/">返回首页</a> · Kniu System &copy; 2026</div>
  </div>
</div>
