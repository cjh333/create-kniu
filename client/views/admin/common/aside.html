<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin_global.min.css");

  :host {
    display: block;
  }
</style>
<aside class="kniu_web_aside_sidebar_group">
  <p class="kniu_web_aside_sidebar_label">{{workspaceLabel}}</p>
  <kniu-navbar type="side" home="#/admin" active="{{activeNavigationPath}}" aria-label="应用导航">
    <template #brand>
      <span class="kniu_web_aside_sidebar_brandmark">{{brandMark}}</span>
      <span class="kniu_web_aside_sidebar_brandtitle">{{brandName}}<strong>{{brandSuffix}}</strong></span>
    </template>
    <template #default>
      <kniu-navbar-cell index="/admin" href="#/admin">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#ff5c35;" icon="House" />控制台
      </kniu-navbar-cell>
      <kniu-navbar-cell index="/seo" href="#/seo">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#635bff;" icon="Document" />网站信息
      </kniu-navbar-cell>
      <kniu-navbar-cell index="/nav" href="#/nav">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#19a974;" icon="Folder" />栏目管理
      </kniu-navbar-cell>
    </template>
  </kniu-navbar>
  <div class="sidebar-foot">
    <kniu-btn class="kniu_web_aside_sidebar" unstyled kniu@click="handleHelpRequest" native-type="button">
      <kniu-icon style="margin-right:5px;font-size:17px;color:#9aa3b8;" icon="Question" />{{helpLabel}}
    </kniu-btn>
    <kniu-btn class="kniu_web_aside_sidebar" unstyled kniu@click="handleLogout" native-type="button">
      <kniu-icon style="margin-right:5px;font-size:17px;color:#9aa3b8;" icon="Logout" />退出登录
    </kniu-btn>
    <div class="user">
      <span class="avatar">{{userAvatar}}</span>
      <div><b>{{userName}}</b><small>{{userRole}}</small></div>
      <span>•••</span>
    </div>
  </div>
</aside>
