<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_global.min.css");

  :host {
    display: block;
  }

  .kniu_web_aside_help_body {
    font-size: 14px;
    color: #303133;
  }

  .kniu_web_aside_help_body>table {
    font-size: 13px;
  }
</style>
<aside class="kniu_web_aside_sidebar_group">
  <kniu-navbar :option="{{type:'side',home:'#/admin',active:(activeNavigationPath)}}" aria-label="应用导航">
    <template #brand>
      <kniu-image style="width:100%;background-color:transparent;" :option="{{src:logo}}" />
    </template>
    <template #default>
      <kniu-navbar-cell :option="{{route:'/admin',href:'#/admin'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#ff5c35;" :option="{{icon:'home'}}" />控制台
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showWebsiteInfo}}" :option="{{route:'/seo',href:'#/seo'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#635bff;" :option="{{icon:'web'}}" />网站信息
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/aboutedit',href:'#/aboutedit'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#e74c3c;" :option="{{icon:'username_fill'}}" />关于我
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showDaily}}" :option="{{route:'/daily',href:'#/daily'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#f39c12;" :option="{{icon:'info_circle'}}" />每日一句
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/article',href:'#/article'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#19a974;" :option="{{icon:'document'}}" />文章管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showUserManagement}}" :option="{{route:'/user',href:'#/user'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#8e44ad;" :option="{{icon:'user'}}" />账号管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/comment',href:'#/comment'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#e67e22;" :option="{{icon:'msg'}}" />评论管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/reply',href:'#/reply'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#409eff;" :option="{{icon:'msg'}}" />回复管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showDatabaseAdmin}}" :option="{{route:'/database',href:'#/database'}}">
        <kniu-icon style="margin-right:5px;font-size:18px;color:#0f7b6c;" :option="{{icon:'database_fill'}}" />数据库管理
      </kniu-navbar-cell>
    </template>
  </kniu-navbar>
  <div class="kniu_web_aside_sidebar_foot">
    <kniu-btn class="kniu_web_aside_sidebar" :option="{{unstyled:true,nativeType:'button'}}" @click="handleHelpRequest">
      <kniu-icon style="margin-right:5px;font-size:18px;color:#9aa3b8;" :option="{{icon:'help'}}" />{{helpLabel}}
    </kniu-btn>
    <kniu-btn class="kniu_web_aside_sidebar" :option="{{unstyled:true,nativeType:'button'}}" @click="handleLogout">
      <kniu-icon style="margin-right:5px;font-size:18px;color:#9aa3b8;" :option="{{icon:'exit'}}" />退出登录
    </kniu-btn>
    <div class="user">
      <span class="avatar">{{userAvatar}}</span>
      <div><b>{{userName}}</b><small>{{userRole}}</small></div>
    </div>
  </div>
</aside>
<!-- 帮助手册 -->
<kniu-modal class="kniu_web_aside_help" style="width:960px;" :option="{{show:(showHelp)}}" @close="closeHelp">
  <template #header>
    <span>{{helpTitle}}</span>
    <kniu-btn :option="{{link:true,size:'small',type:'primary'}}" @click="closeHelp">
      <kniu-icon :option="{{icon:'close'}}" />
    </kniu-btn>
  </template>
  <template #default>
    <div class="kniu_web_aside_help_body kniu_sys_markdown_body">{{@helpHtml}}</div>
  </template>
  <template #footer>
    <kniu-btn :option="{{type:'primary'}}" @click="closeHelp">关 闭</kniu-btn>
  </template>
</kniu-modal>
