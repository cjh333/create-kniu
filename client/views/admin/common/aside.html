<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin_global.min.css");

  :host {
    display: block;
  }
</style>
<aside class="kniu_web_aside_sidebar_group">
  <p class="kniu_web_aside_sidebar_label">{{workspaceLabel}}</p>
  <kniu-navbar aria-label="应用导航" kniu:options="{{({type:'side',home:'#/admin',active:(activeNavigationPath)})}}">
    <template #brand>
      <span class="kniu_web_aside_sidebar_brandmark">{{brandMark}}</span>
      <span class="kniu_web_aside_sidebar_brandtitle">{{brandName}}<strong>{{brandSuffix}}</strong></span>
    </template>
    <template #default>
      <kniu-navbar-cell kniu:options="{{({index:'/admin',href:'#/admin'})}}">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#ff5c35;" kniu:options="{{({icon:'House'})}}" />控制台
      </kniu-navbar-cell>
      <kniu-navbar-cell kniu:options="{{({index:'/seo',href:'#/seo'})}}">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#635bff;" kniu:options="{{({icon:'Document'})}}" />网站信息
      </kniu-navbar-cell>
      <kniu-navbar-cell kniu:options="{{({index:'/nav',href:'#/nav'})}}">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#19a974;" kniu:options="{{({icon:'Folder'})}}" />栏目管理
      </kniu-navbar-cell>
      <kniu-navbar-cell kniu:if="{{showUserManagement}}" kniu:options="{{({index:'/users',href:'#/users'})}}">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#8e44ad;" kniu:options="{{({icon:'User'})}}" />用户管理
      </kniu-navbar-cell>
      <kniu-navbar-cell kniu:options="{{({index:'/comment',href:'#/comment'})}}">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#e67e22;" kniu:options="{{({icon:'ChatDotRound'})}}" />评论管理
      </kniu-navbar-cell>
      <kniu-navbar-cell kniu:options="{{({index:'/reply',href:'#/reply'})}}">
        <kniu-icon style="margin-right:5px;font-size:17px;color:#409eff;" kniu:options="{{({icon:'ChatDotRound'})}}" />回复管理
      </kniu-navbar-cell>
    </template>
  </kniu-navbar>
  <div class="sidebar-foot">
    <kniu-btn class="kniu_web_aside_sidebar" kniu:options="{{({unstyled:true,nativeType:'button'})}}" kniu@click="handleHelpRequest">
      <kniu-icon style="margin-right:5px;font-size:17px;color:#9aa3b8;" kniu:options="{{({icon:'Question'})}}" />{{helpLabel}}
    </kniu-btn>
    <kniu-btn class="kniu_web_aside_sidebar" kniu:options="{{({unstyled:true,nativeType:'button'})}}" kniu@click="handleLogout">
      <kniu-icon style="margin-right:5px;font-size:17px;color:#9aa3b8;" kniu:options="{{({icon:'Logout'})}}" />退出登录
    </kniu-btn>
    <div class="user">
      <span class="avatar">{{userAvatar}}</span>
      <div><b>{{userName}}</b><small>{{userRole}}</small></div>
      <span>•••</span>
    </div>
  </div>
</aside>
