<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_global.min.css");

  :host {
    display: block;
  }

  .kniu_web_aside_help_body {
    font-size: 14px;
    color: #303133;
  }

  .kniu_web_aside_help_body>table {
    font-size: 13px;
  }

  .aside_sidebar_icon {
    margin-right: 5px;
    font-size: 18px;
  }
</style>
<aside class="kniu_web_aside_sidebar_group">
  <kniu-navbar :option="{{home:'#/admin',active:(activeNavigationPath),ariaLabel:'应用导航',type:'side'}}">
    <template #brand>
      <kniu-image style="width:100%;background-color:transparent;" :src="{{logo}}" />
    </template>
    <template #default>
      <kniu-navbar-cell :option="{{route:'/admin',href:'#/admin'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'home',style:'color:#ff5c35;'}}" />控制台
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showWebsiteInfo}}" :option="{{route:'/seo',href:'#/seo'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'web',style:'color:#635bff;'}}" />网站信息
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/aboutedit',href:'#/aboutedit'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'username_fill',style:'color:#e74c3c;'}}" />关于我
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showDaily}}" :option="{{route:'/daily',href:'#/daily'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'info_circle',style:'color:#f39c12;'}}" />每日一句
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/article',href:'#/article'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'document',style:'color:#19a974;'}}" />文章管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showUserManagement}}" :option="{{route:'/user',href:'#/user'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'user',style:'color:#8e44ad;'}}" />账号管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/comment',href:'#/comment'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'msg',style:'color:#e67e22;'}}" />评论管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :option="{{route:'/reply',href:'#/reply'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'msg',style:'color:#409eff;'}}" />回复管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showWebsiteInfo}}" :option="{{route:'/feedback',href:'#/feedback'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'edit_square',style:'color:#c0392b;'}}" />反馈管理
      </kniu-navbar-cell>
      <kniu-navbar-cell :if="{{showDatabaseAdmin}}" :option="{{route:'/dbconnect',href:'#/dbconnect'}}">
        <kniu-icon class="aside_sidebar_icon" :option="{{icon:'database_fill',style:'color:#0f7b6c;'}}" />数据库管理
      </kniu-navbar-cell>
    </template>
  </kniu-navbar>
  <div class="kniu_web_aside_sidebar_foot">
    <kniu-btn class="kniu_web_aside_sidebar" :option="{{unstyled:true,nativeType:'button'}}" @click="handleHelpRequest">
      <kniu-icon class="aside_sidebar_icon" :option="{{icon:'help',style:'color:#9aa3b8;'}}" />{{helpLabel}}
    </kniu-btn>
    <kniu-btn class="kniu_web_aside_sidebar" :option="{{unstyled:true,nativeType:'button'}}" @click="handleLogout">
      <kniu-icon class="aside_sidebar_icon" :option="{{icon:'exit',style:'color:#9aa3b8;'}}" />退出登录
    </kniu-btn>
    <div class="user">
      <span class="avatar">{{userAvatar}}</span>
      <div>
        <strong>{{userName}}</strong>
        <small>{{userRole}}</small>
      </div>
    </div>
  </div>
</aside>
<!-- 帮助手册 -->
<kniu-modal class="kniu_web_aside_help" :option="{{show:(showHelp),onClose:(closeHelp),minmax:true,style:'width:960px'}}">
  <template #header>
    <span>{{helpTitle}}</span>
  </template>
  <template #default>
    <div class="kniu_web_aside_help_body kniu_sys_markdown_body">{{@helpHtml}}</div>
  </template>
  <template #footer>
    <kniu-btn :option="{{type:'primary'}}" @click="closeHelp">关 闭</kniu-btn>
  </template>
</kniu-modal>
