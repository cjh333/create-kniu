<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_global.min.css");

  :host {
    display: block;
  }

  .kniu_web_aside_head {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    align-items: center;
    gap: 5px;
    border-bottom: 1px solid var(--line);
    padding: 8px 6px;
    height: 58px;
    min-height: 58px;
    background-color: #fff;
  }

  .kniu_web_aside_mdnav_wrap {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    padding: 8px;
    box-shadow: 0 6px 16px rgba(23, 33, 59, .06);
  }

  .kniu_web_aside_mdnav {
    padding: 0;
  }

  .kniu_web_aside_mdnav_title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .kniu_web_aside_brand {
    margin-right: 0;
  }

  .kniu_web_aside_crumb_wrap {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
  }

  .kniu_web_aside_head_actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    width: auto;
  }

  .kniu_web_aside_head_actions kniu-badge,
  .kniu_web_aside_head_actions>kniu-btn {
    display: inline-block;
  }

  .kniu_web_aside_front_text {
    display: none;
  }

  .kniu_web_aside_note_icon {
    width: 1em;
    height: 1em;
    color: #ff5c35;
  }

  .kniu_web_aside_front_icon {
    width: 1em;
    height: 1em;
    color: #409eff;
  }

  @media (min-width: 341px) {
    .kniu_web_aside_head {
      grid-template-columns: 40px minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px 10px;
    }
  }

  @media (min-width: calc(1024px - 60px)) {
    .kniu_web_aside_mdnav_wrap {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .kniu_web_aside_mdnav {
      font-size: 13px;
    }

    .kniu_web_aside_front_text {
      display: inline;
    }

    .kniu_web_aside_front_link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }
  }

  @media (min-width: calc(1280px - 60px)) {
    .kniu_web_aside_head {
      display: flex;
      justify-content: space-between;
      height: 72px;
      min-height: 0;
      padding: 0 18px;
    }
  }
</style>
<nav class="kniu_web_aside_mdnav_wrap" aria-label="移动端应用导航">
  <kniu-btn class="kniu_web_aside_mdnav{{currentPath === '/admin' ? ' active' : ''}}" data-nav="/admin" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'home'}}" /><span class="kniu_web_aside_mdnav_title">控制台</span>
  </kniu-btn>
  <kniu-btn kniu:if="{{showWebsiteInfo}}" class="kniu_web_aside_mdnav{{currentPath === '/seo' ? ' active' : ''}}" data-nav="/seo" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'document'}}" /><span class="kniu_web_aside_mdnav_title">网站信息</span>
  </kniu-btn>
  <kniu-btn class="kniu_web_aside_mdnav{{currentPath === '/aboutedit' ? ' active' : ''}}" data-nav="/aboutedit" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'eye'}}" /><span class="kniu_web_aside_mdnav_title">关于我</span>
  </kniu-btn>
  <kniu-btn kniu:if="{{showDaily}}" class="kniu_web_aside_mdnav{{currentPath === '/daily' ? ' active' : ''}}" data-nav="/daily" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'amaze'}}" /><span class="kniu_web_aside_mdnav_title">每日一句</span>
  </kniu-btn>
  <kniu-btn class="kniu_web_aside_mdnav{{currentPath === '/article' ? ' active' : ''}}" data-nav="/article" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'document_fill'}}" /><span class="kniu_web_aside_mdnav_title">文章管理</span>
  </kniu-btn>
  <kniu-btn kniu:if="{{showUserManagement}}" class="kniu_web_aside_mdnav{{currentPath === '/user' ? ' active' : ''}}" data-nav="/user" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'user'}}" /><span class="kniu_web_aside_mdnav_title">用户管理</span>
  </kniu-btn>
  <kniu-btn class="kniu_web_aside_mdnav{{currentPath === '/comment' ? ' active' : ''}}" data-nav="/comment" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'msg'}}" /><span class="kniu_web_aside_mdnav_title">评论管理</span>
  </kniu-btn>
  <kniu-btn class="kniu_web_aside_mdnav{{currentPath === '/reply' ? ' active' : ''}}" data-nav="/reply" kniu:option="{{block:true,nativeType:'button'}}" kniu@click="handleNavigation">
    <kniu-icon class="kniu_web_aside_mdnav_icon" kniu:option="{{icon:'msg'}}" /><span class="kniu_web_aside_mdnav_title">回复管理</span>
  </kniu-btn>
</nav>
<header class="kniu_web_aside_head">
  <button class="kniu_web_aside_brand" aria-label="返回总览" kniu@click="handleHomeNavigation" type="button">{{brandMark}}</button>
  <div class="kniu_web_aside_crumb_wrap">
    <span class="kniu_web_aside_crumb">{{workspaceLabel}} / </span>
    <strong>{{currentApp.name}}</strong>
  </div>
  <div class="kniu_web_aside_head_actions">
    <div class="kniu_web_aside_note" title="回复消息" kniu:option="{{notificationBadge}}" kniu@click="handleNotificationRequest">
      <kniu-icon class="kniu_web_aside_note_icon" kniu:option="{{icon:(hasUnreadReply ? 'unmsg' : 'msg')}}" />
    </div>
    <kniu-btn class="kniu_web_aside_front_link" kniu@click="toFrontHome">
      <kniu-icon class="kniu_web_aside_front_icon" kniu:option="{{icon:'home'}}" />
      <span class="kniu_web_aside_front_text">前端首页</span>
    </kniu-btn>
    <kniu-btn kniu@click="handleRefresh">
      <kniu-icon kniu:option="{{icon:'refresh'}}" />
    </kniu-btn>
  </div>
</header>
