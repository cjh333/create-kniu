<style>
  @import url("@kniu/kniu.min.css");
  @import url("@style/webs.min.css");

  :host {
    display: block;
  }

  .kniu_web_aside_head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding: 0 18px;
    height: 72px;
    background-color: #fff;
  }
</style>
<nav class="kniu_web_aside_mdnav_wrap" aria-label="移动端应用导航">
  <template kniu:for="{{navigation}}" kniu:key="path">
    <kniu-btn class="kniu_web_aside_mdnav{{currentPath === item.path ? ' active' : ''}}" nav="{{item.path}}" kniu@click="handleNavigation" native-type="button">
      <kniu-icon class="kniu_web_aside_mdnav_icon" icon="{{item.icon}}" />
      <span class="kniu_web_aside_mdnav_title">{{item.name}}</span>
    </kniu-btn>
  </template>
</nav>
<header class="kniu_web_aside_head">
  <kniu-btn class="kniu_web_aside_brand" kniu@click="handleHomeNavigation" aria-label="返回总览" native-type="button">{{brandMark}}</kniu-btn>
  <div class="kniu_web_aside_crumb_wrap">
    <span class="kniu_web_aside_crumb">{{workspaceLabel}} / </span>
    <strong>{{currentApp.name}}</strong>
  </div>
  <div class="kniu_web_aside_head_actions">
    <kniu-form ref="form" model="{{searchform}}">
      <kniu-input-group style="margin-bottom: 0;">
        <kniu-input kniu:model="{{searchform.query}}" name="keyword" placeholder="搜索文章标题..." autocomplete="off" clearable>
          <template #append label-width="80px"><kniu-icon icon="Search" /></template>
        </kniu-input>
      </kniu-input-group>
    </kniu-form>
    <kniu-badge class="kniu_web_aside_note" kniu@click="handleNotificationRequest" is-dot>
      <kniu-icon style="font-size:16px;color:#ff5c35;" icon="ChatDotRound" />
    </kniu-badge>
    <kniu-btn class="admin_tab_refresh1" kniu@click="handleRefresh">
      <kniu-icon icon="Refresh" />
    </kniu-btn>
  </div>
</header>
