<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_all.min.css");

  .db_sql_result {
    overflow: auto;
    border: 1px solid #ebeef5;
    margin-top: 10px;
    margin-left: 100px;
    min-height: 30px;
  }

  .db_sql_result pre {
    margin: 0;
    padding: 10px;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <kniu-btn :option="{{type:'primary'}}" @click="openCreateDatabase">新建数据库</kniu-btn>
      <div class="detail_head_actions">
        <kniu-btn @click="openImport">导入数据库</kniu-btn>
        <kniu-btn :option="{{link:true,size:'small',type:'primary'}}" @click="goDbConnect">返回</kniu-btn>
      </div>
    </div>

    <div class="detail_wrap">
      <template :if="{{dbTable.data.length > 0}}">
        <kniu-table :option="{{dbTable}}">
          <kniu-table-col :option="{{width:60,align:'center',fixed:'left',type:'checkbox'}}" />
          <kniu-table-col :option="{{field:'sid',label:'排序',width:90,align:'center',editable:'number',sortable:true,onChange:(updateSort)}}" />
          <kniu-table-col :option="{{field:'id',label:'ID',width:90,align:'center',fixed:'left',sortable:true}}" />
          <kniu-table-col :option="{{field:'name',label:'库名',align:'center',showOverflowTooltip:true}}" />
          <kniu-table-col :option="{{field:'table_count',label:'表数量',width:100,align:'center',sortable:true}}" />
          <kniu-table-col :option="{{field:'size_text',label:'体积',align:'center',showOverflowTooltip:true}}" />
          <kniu-table-col :option="{{label:'操作',width:200,align:'center',fixed:'right'}}">
            <template #default>
              <kniu-btn :option="{{type:'danger',size:'small',link:true}}" @click="deleteRow">删除</kniu-btn>
              <kniu-btn :option="{{type:'primary',size:'small',link:true}}" @click="viewRow">查看</kniu-btn>
            </template>
          </kniu-table-col>
        </kniu-table>
      </template>
      <template :else>
        <kniu-empty :option="{{note:'还没有数据库，请先配置连接'}}" />
      </template>
    </div>
  </div>
</section>

<kniu-modal :option="{{show:(showCreateDatabase),onClose:(closeCreateDatabase),style:'width:30vw;'}}">
  <template #header>
    <span>新建数据库</span>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input :form="{{sqlModel.sql}}" :option="{{name:'sql',rows:8,placeholder:'CREATE DATABASE IF NOT EXISTS xxx DEFAULT CHARACTER SET = utf8mb4;',type:'textarea'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">sql 命令</template>
      </kniu-input>
    </kniu-form-cell>
    <div :if="{{sqlResultText}}" class="db_sql_result">
      <pre>{{sqlResultText}}</pre>
    </div>
  </template>
  <template #footer>
    <kniu-btn @click="closeCreateDatabase">关 闭</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="submitCreateDatabase">执 行</kniu-btn>
  </template>
</kniu-modal>

<kniu-modal :option="{{show:(showImport),onClose:(closeImport),style:'width:720px;'}}">
  <template #header>
    <span>导入数据库</span>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input>
        <template #prepend :option="{{labelWidth:'100px'}}">上传 sql 文件</template>
        <template #append :option="{{labelWidth:'100px'}}">
          <kniu-upload ref="upload" :form="{{files}}" :option="{{name:'file',disabled:(!canEditContent),maxSize:5,accept:'.sql'}}">选择文件</kniu-upload>
        </template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <p style="margin-left:100px;font-size:12px;color:#909399;">注：导入会按分号逐条执行，遇错即停。单个 .sql 文件上限 5MB。</p>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn @click="closeImport">取 消</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="submitImport">开始导入</kniu-btn>
  </template>
</kniu-modal>
