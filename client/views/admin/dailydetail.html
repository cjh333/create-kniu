<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_title {
    font-size: 16px;
    font-weight: 600;
    color: #303133;
  }

  .detail_head_actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail_head_actions kniu-input-group {
    display: block;
    width: 280px;
    min-width: 0;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <span class="detail_title">每日一句</span>
      <div class="detail_head_actions">
        <kniu-input kniu:model="{{keyword}}" kniu:options="{{({name:'keyword',placeholder:'请输入标题'})}}" kniu@keydown.enter="searchList" kniu@input="debouncedSearch">
          <template #append label-width="48px">
            <kniu-btn aria-label="搜索" kniu:options="{{({text:true})}}" kniu@click="searchList">
              <kniu-icon kniu:options="{{({icon:'Search'})}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn kniu:options="{{({link:true,type:'primary',size:'small'})}}" kniu@click="goBack">返回</kniu-btn>
      </div>
    </div>
    <div class="detail_wrap">
      <kniu-table ref="table" kniu:options="{{dailyTable}}" />
      <kniu-page ref="page" kniu:options="{{dailyPage}}" />
    </div>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal style="width:520px;" kniu:options="{{({show:(showmodal)})}}" kniu@close="closeDialog">
  <template #header>
    <span>修改每日一句</span>
    <kniu-btn kniu:options="{{({link:true,size:'small',type:'primary'})}}" kniu@click="closeDialog">
      <kniu-icon kniu:options="{{({icon:'Close'})}}" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.sid}}" kniu:options="{{({name:'sid',placeholder:'请输入排序'})}}">
        <template #prepend label-width="100px">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.cn}}" kniu:options="{{({name:'cn',placeholder:'请输入中文'})}}">
        <template #prepend label-width="100px">中文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.en}}" kniu:options="{{({name:'en',placeholder:'请输入英文'})}}">
        <template #prepend label-width="100px">英文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch kniu:model="{{editform.is_show}}" kniu:options="{{switchOptions}}">
        <template #prepend label-width="100px">显示</template>
      </kniu-switch>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn kniu@click="closeDialog">取 消</kniu-btn>
    <kniu-btn style="margin-left:10px;" kniu:options="{{({type:'primary'})}}" kniu@click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
