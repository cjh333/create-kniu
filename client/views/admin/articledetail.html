<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/adminHome.min.css");

  .index_cell2 {
    background-color: #fff;
  }

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_title {
    font-size: 16px;
    font-weight: 600;
    color: #303133;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }

  .detail_cover {
    width: 80px;
    height: 80px;
    border-radius: 4px;
    border: 1px solid #ebeef5;
  }

  .detail_upload_row {
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr);
    align-items: start;
    width: 100%;
  }

  .detail_upload_label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    border: 1px solid #dcdfe6;
    border-right: 0;
    border-radius: 4px 0 0 4px;
    background: #f5f7fa;
    color: #909399;
    box-sizing: border-box;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell2">
    <div class="detail_head">
      <span class="detail_title">文章</span>
      <kniu-btn link type="primary" size="small" kniu@click="goBack">返回</kniu-btn>
    </div>
    <div class="detail_wrap">
      <kniu-table style="width:100%;max-height:480px;" kniu:loading="{{loading}}" data="{{list}}" ref="table" row-key="id" stripe border>
        <kniu-table-col style="width:60px;text-align:center;" fixed type="checkbox" />
        <kniu-table-col fixed field="id" label="ID" width="80" />
        <kniu-table-col field="sid" label="排序" width="80" align="center" />
        <kniu-table-col field="title" label="标题" min-width="360" show-overflow-tooltip />
        <kniu-table-col field="subtitle" label="副标题" min-width="360" show-overflow-tooltip />
        <kniu-table-col field="summary" label="摘要" min-width="360" show-overflow-tooltip />
        <kniu-table-col field="create_time" label="发布时间" width="160" align="center" />
        <kniu-table-col field="is_show" label="显示" width="80" align="center">
          <template #default>
            <kniu-switch kniu:model="{{scope.row.is_show}}" kniu@change="updateShow(scope.$index, list)" active-value="1" inactive-value="0" active-color="#13ce66" inactive-color="#ff4949" />
          </template>
        </kniu-table-col>
        <kniu-table-col field="cover" label="封面" width="180" align="center">
          <template #default>
            <kniu-image class="detail_cover" src="{{scope.row.cover}}" alt="封面" fit="cover"></kniu-image>
          </template>
        </kniu-table-col>
        <kniu-table-col fixed="right" label="操作" width="120" align="center">
          <template #default>
            <kniu-btn link type="danger" size="small" kniu@click="deleteRow(scope.$index, list)">删除</kniu-btn>
            <kniu-btn link type="primary" size="small" kniu@click="editRow(scope.$index, list)">修改</kniu-btn>
          </template>
        </kniu-table-col>
      </kniu-table>
      <kniu-page background layout="总数,首页,上一页,页码,下一页,末页,条数" total="{{total}}" page-size="{{pageRows}}" current-page="{{currentPage}}" kniu@current-change="changePage" kniu@size-change="changePageSize" />
    </div>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal style="width:90vw;" show="{{showmodal}}">
  <template #header>
    <span>修改文章</span>
    <kniu-btn link type="primary" size="small" kniu@click="closeDialog">
      <kniu-icon icon="Close" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editForm.sid}}" name="sid" placeholder="请输入排序">
        <template #prepend label-width="100px">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editForm.title}}" name="title" placeholder="请输入标题">
        <template #prepend label-width="100px">标题</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editForm.subtitle}}" name="subtitle" placeholder="请输入副标题">
        <template #prepend label-width="100px">副标题</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editForm.summary}}" name="summary" placeholder="请输入摘要" row="6" type="textarea">
        <template #prepend label-width="100px">摘要</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editForm.url}}" name="url" placeholder="请输入链接">
        <template #prepend label-width="100px">链接</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-editor ref="editor" toolbar="{{toolbar}}" kniu:model="{{editForm.content}}" name="content">
        <template #prepend label-width="100px">正文</template>
      </kniu-editor>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input>
        <template #prepend label-width="100px">封面</template>
        <template #append label-width="100px">
          <kniu-upload ref="upload" kniu:model="{{files}}" name="cover" max-size="5" accept="image/*">选择图片</kniu-upload>
        </template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch kniu:model="{{editForm.is_show}}" name="is_show" active-value="1" inactive-value="0" active-color="#13ce66" inactive-color="#ff4949">
        <template #prepend label-width="100px">显示</template>
      </kniu-switch>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn kniu@click="closeDialog">取 消</kniu-btn>
    <kniu-btn style="margin-left:10px;" kniu@click="saveEdit" type="primary">保 存</kniu-btn>
  </template>
</kniu-modal>
