<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_title {
    font-size: 16px;
    font-weight: 600;
    color: #303133;
  }

  .detail_head_actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail_head_actions kniu-input-group {
    display: block;
    width: 280px;
    min-width: 0;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }

  .detail_upload_row {
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr);
    align-items: start;
    width: 100%;
  }

  .detail_upload_label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    border: 1px solid #dcdfe6;
    border-right: 0;
    border-radius: 4px 0 0 4px;
    background-color: #f5f7fa;
    color: #909399;
    box-sizing: border-box;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <span class="detail_title">文章</span>
      <div class="detail_head_actions">
        <kniu-btn kniu:if="{{canEditContent}}" kniu:options="{{({type:'primary'})}}" kniu@click="addRow">添加</kniu-btn>
        <kniu-input kniu:model="{{keyword}}" kniu:options="{{({name:'keyword',placeholder:'请输入标题'})}}" kniu@keydown.enter="searchList" kniu@input="debouncedSearch">
          <template #append label-width="48px">
            <kniu-btn aria-label="搜索" kniu:options="{{({text:true})}}" kniu@click="searchList">
              <kniu-icon kniu:options="{{({icon:'Search'})}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn kniu:options="{{({link:true,type:'primary',size:'small'})}}" kniu@click="goBack">返回</kniu-btn>
      </div>
    </div>
    <div class="detail_wrap">
      <kniu-table ref="table" kniu:options="{{articleTable}}"></kniu-table>
      <kniu-page kniu:options="{{articlePage}}" />
    </div>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal style="width:90vw;" kniu:options="{{({show:(showmodal)})}}" kniu@close="closeDialog">
  <template #header>
    <span>{{dialogTitle}}</span>
    <kniu-btn kniu:options="{{({link:true,type:'primary',size:'small'})}}" kniu@click="closeDialog">
      <kniu-icon kniu:options="{{({icon:'Close'})}}" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.sid}}" kniu:options="{{({name:'sid',placeholder:'请输入排序'})}}">
        <template #prepend label-width="100px">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.title}}" kniu:options="{{({name:'title',placeholder:'请输入标题'})}}">
        <template #prepend label-width="100px">标题</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.subtitle}}" kniu:options="{{({name:'subtitle',placeholder:'请输入副标题'})}}">
        <template #prepend label-width="100px">副标题</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.summary}}" kniu:options="{{({name:'summary',placeholder:'请输入摘要',row:'6',type:'textarea'})}}">
        <template #prepend label-width="100px">摘要</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:model="{{editform.url}}" kniu:options="{{({name:'url',placeholder:'请输入链接'})}}">
        <template #prepend label-width="100px">链接</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-date-picker ref="datePicker" kniu:model="{{editform.create_time}}" kniu:options="{{({...(datePickerOptions),name:'create_time'})}}">
        <template #prepend label-width="100px">发布时间</template>
      </kniu-date-picker>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-editor ref="editor" kniu:model="{{editform.content}}" kniu:options="{{({toolbar:(toolbar),name:'content'})}}">
        <template #prepend label-width="100px">正文</template>
      </kniu-editor>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input>
        <template #prepend label-width="100px">封面</template>
        <template #append label-width="100px">
          <kniu-upload ref="upload" kniu:model="{{files}}" kniu:options="{{({name:'cover',maxSize:'5',accept:'image/*'})}}">选择图片</kniu-upload>
        </template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch kniu:model="{{editform.is_show}}" kniu:options="{{switchOptions}}">
        <template #prepend label-width="100px">显示</template>
      </kniu-switch>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn kniu@click="closeDialog">取 消</kniu-btn>
    <kniu-btn style="margin-left:10px;" kniu:options="{{({type:'primary'})}}" kniu@click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
