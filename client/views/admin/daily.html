<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_head_actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
  }

  .detail_head_actions kniu-input,
  .detail_head_actions kniu-input-group {
    display: block;
    width: 280px;
    max-width: 100%;
    min-width: 0;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <div class="detail_head_actions">
        <kniu-input :form="{{keyword}}" :option="{{name:'keyword',placeholder:'请输入中文标题'}}" @keydown.enter="searchList" @input="debouncedSearch">
          <template #append label-width="48px">
            <kniu-btn aria-label="搜索" :option="{{text:true}}" @click="searchList">
              <kniu-icon :option="{{icon:'search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn :option="{{link:true,type:'primary',size:'small'}}" @click="goBack">返回</kniu-btn>
      </div>
    </div>
    <div class="detail_wrap">
      <kniu-table ref="table" :option="{{dailyTable}}">
        <kniu-table-col type="checkbox" width="60" align="center" fixed="left" />
        <kniu-table-col field="id" label="ID" width="80" align="center" fixed="left" sortable />
        <kniu-table-col field="sid" label="排序" width="100" align="center" editable="number" sortable />
        <kniu-table-col field="cn" label="中文" show-overflow-tooltip />
        <kniu-table-col field="en" label="英文" show-overflow-tooltip />
        <kniu-table-col :if="{{canEditContent}}" field="is_show" label="显示" width="120" align="center">
          <template #default>
            <kniu-switch :option="{{switchOptions}}" @change="updateShow" />
          </template>
        </kniu-table-col>
        <kniu-table-col field="create_time" label="创建时间" width="180" align="center" />
        <kniu-table-col :if="{{canEditContent}}" label="操作" width="160" align="center" fixed="right">
          <template #default>
            <kniu-btn type="danger" size="small" link @click="deleteRow">删除</kniu-btn>
            <kniu-btn type="primary" size="small" link @click="editRow">修改</kniu-btn>
          </template>
        </kniu-table-col>
      </kniu-table>
      <kniu-page ref="page" :option="{{dailyPage}}" />
    </div>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal style="width:520px;" :option="{{show:(showmodal)}}" @close="closeDialog">
  <template #header>
    <span>修改每日一句</span>
    <kniu-btn :option="{{link:true,size:'small',type:'primary'}}" @click="closeDialog">
      <kniu-icon :option="{{icon:'close'}}" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input :form="{{editform.sid}}" :option="{{name:'sid',placeholder:'请输入排序'}}">
        <template #prepend label-width="100px">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{editform.cn}}" :option="{{name:'cn',placeholder:'请输入中文'}}">
        <template #prepend label-width="100px">中文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{editform.en}}" :option="{{name:'en',placeholder:'请输入英文'}}">
        <template #prepend label-width="100px">英文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{editform.is_show}}" :option="{{switchOptions}}">
        <template #prepend label-width="100px">显示</template>
      </kniu-switch>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn @click="closeDialog">取 消</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
