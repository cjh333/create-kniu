<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_all.min.css");
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <div class="detail_head_actions">
        <kniu-input :form="{{keyword}}" :option="{{name:'keyword',placeholder:'请输入中文标题'}}" @keydown.enter="searchList" @input="debouncedSearch">
          <template #append :option="{{labelWidth:'48px'}}">
            <kniu-btn :option="{{text:true,ariaLabel:'搜索'}}" @click="searchList">
              <kniu-icon :option="{{icon:'search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn :option="{{link:true,type:'primary'}}" @click="goBack">返回</kniu-btn>
      </div>
    </div>
    <div class="detail_wrap">
      <kniu-table ref="table" :option="{{dailyTable}}">
        <kniu-table-col :option="{{width:60,align:'center',fixed:'left',type:'checkbox'}}" />
        <kniu-table-col :option="{{field:'sid',label:'排序',width:90,align:'center',fixed:'left',editable:'number',sortable:true,onChange:(updateSort)}}" />
        <kniu-table-col :option="{{field:'id',label:'ID',width:90,align:'center',fixed:'left',sortable:true}}" />
        <kniu-table-col :option="{{field:'cn',label:'中文',width:600,showOverflowTooltip:true}}" />
        <kniu-table-col :option="{{field:'en',label:'英文',width:600,showOverflowTooltip:true}}" />
        <kniu-table-col :if="{{canEditContent}}" :option="{{field:'is_show',label:'显示',width:120,align:'center'}}">
          <template #default>
            <kniu-switch :option="{{switchOption}}" @change="updateShow" />
          </template>
        </kniu-table-col>
        <kniu-table-col :option="{{field:'create_time',label:'创建时间',width:180,align:'center'}}" />
        <kniu-table-col :if="{{canEditContent}}" :option="{{label:'操作',width:160,align:'center',fixed:'right'}}">
          <template #default>
            <kniu-btn :option="{{type:'danger',link:true,size:'small'}}" @click="deleteRow">删除</kniu-btn>
            <kniu-btn :option="{{type:'primary',link:true,size:'small'}}" @click="editRow">修改</kniu-btn>
          </template>
        </kniu-table-col>
      </kniu-table>
      <kniu-page ref="page" :option="{{dailyPage}}" />
    </div>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal :option="{{show:(showmodal),onClose:(closeDialog),style:'width:520px;'}}">
  <template #header>
    <span>修改每日一句</span>
  </template>
  <template #default>
    <kniu-form ref="form" :option="{{editform}}">
    <kniu-form-cell>
      <kniu-input :form="{{editform.sid}}" :option="{{name:'sid',placeholder:'请输入排序'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{editform.cn}}" :option="{{name:'cn',placeholder:'请输入中文',type:'textarea'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">中文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{editform.en}}" :option="{{name:'en',placeholder:'请输入英文',type:'textarea'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">英文</template>
      </kniu-input>
    </kniu-form-cell>
    </kniu-form>
  </template>
  <template #footer>
    <kniu-btn @click="closeDialog">取 消</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
