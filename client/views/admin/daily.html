<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_title {
    font-size: 16px;
    font-weight: 600;
    color: #303133;
  }

  .detail_head_actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail_head_actions kniu-input,
  .detail_head_actions kniu-input-group {
    display: block;
    width: 280px;
    max-width: 100%;
    min-width: 0;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <span class="detail_title">每日一句</span>
      <div class="detail_head_actions">
        <kniu-input kniu:form="{{keyword}}" kniu:option="{{name:'keyword',placeholder:'请输入中文标题'}}" kniu@keydown.enter="searchList" kniu@input="debouncedSearch">
          <template #append label-width="48px">
            <kniu-btn aria-label="搜索" kniu:option="{{text:true}}" kniu@click="searchList">
              <kniu-icon kniu:option="{{icon:'search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn kniu:option="{{link:true,type:'primary',size:'small'}}" kniu@click="goBack">返回</kniu-btn>
      </div>
    </div>
    <div class="detail_wrap">
      <kniu-table ref="table" kniu:option="{{dailyTable}}">
        <kniu-table-col type="checkbox" width="60" align="center" fixed="left" />
        <kniu-table-col field="id" label="ID" width="80" align="center" fixed="left" sortable />
        <kniu-table-col field="sid" label="排序" width="100" align="center" editable="number" sortable />
        <kniu-table-col field="cn" label="中文" show-overflow-tooltip />
        <kniu-table-col field="en" label="英文" show-overflow-tooltip />
        <kniu-table-col kniu:if="{{canEditContent}}" field="is_show" label="显示" width="120" align="center">
          <template #default>
            <kniu-switch kniu:option="{{switchOptions}}" kniu@change="updateShow" />
          </template>
        </kniu-table-col>
        <kniu-table-col field="create_time" label="创建时间" width="180" align="center" />
        <kniu-table-col kniu:if="{{canEditContent}}" label="操作" width="160" align="center" fixed="right">
          <template #default>
            <kniu-btn type="danger" size="small" link kniu@click="deleteRow">删除</kniu-btn>
            <kniu-btn type="primary" size="small" link kniu@click="editRow">修改</kniu-btn>
          </template>
        </kniu-table-col>
      </kniu-table>
      <kniu-page ref="page" kniu:option="{{dailyPage}}" />
    </div>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal style="width:520px;" kniu:option="{{show:(showmodal)}}" kniu@close="closeDialog">
  <template #header>
    <span>修改每日一句</span>
    <kniu-btn kniu:option="{{link:true,size:'small',type:'primary'}}" kniu@click="closeDialog">
      <kniu-icon kniu:option="{{icon:'close'}}" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.sid}}" kniu:option="{{name:'sid',placeholder:'请输入排序'}}">
        <template #prepend label-width="100px">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.cn}}" kniu:option="{{name:'cn',placeholder:'请输入中文'}}">
        <template #prepend label-width="100px">中文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.en}}" kniu:option="{{name:'en',placeholder:'请输入英文'}}">
        <template #prepend label-width="100px">英文</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch kniu:form="{{editform.is_show}}" kniu:option="{{switchOptions}}">
        <template #prepend label-width="100px">显示</template>
      </kniu-switch>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn kniu@click="closeDialog">取 消</kniu-btn>
    <kniu-btn style="margin-left:10px;" kniu:option="{{type:'primary'}}" kniu@click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
