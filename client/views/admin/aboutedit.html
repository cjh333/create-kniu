<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_all.min.css");
</style>
<section class="seo_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <kniu-form ref="form" :option="{{...(models)}}" @submit.prevent="onSubmit">
      <kniu-form-cell>
        <kniu-input>
          <template #prepend :option="{{labelWidth:'120px'}}">头像</template>
          <template #append :option="{{labelWidth:'120px'}}">
            <kniu-upload ref="upload" :form="{{files}}" :option="{{accept:'image/jpeg,image/png,image/gif',note:'暂无头像'}}">选择头像</kniu-upload>
          </template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input :form="{{models.summary}}" :option="{{name:'summary',placeholder:'请输入首页关于我的简述',type:'textarea'}}">
          <template #prepend :option="{{labelWidth:'120px'}}">简述</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-editor :form="{{models.content}}" :option="{{name:'content',placeholder:'请输入关于我的内容',maxHeight:(editorMaxHeight)}}">
          <template #prepend :option="{{labelWidth:'120px'}}">关于我</template>
        </kniu-editor>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-btn :option="{{disabled:(isSubmitting),nativeType:'submit',style:'margin-left:120px;'}}">
          <template :if="{{isSubmitting}}">
            <kniu-icon :option="{{icon:'loading'}}" />
          </template>
          <template :else>提 交</template>
        </kniu-btn>
      </kniu-form-cell>
    </kniu-form>
  </div>
</section>
