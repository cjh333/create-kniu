<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_all.min.css");

  .detail_wrap {
    margin-bottom: 16px;
  }

  .db_sql_result {
    overflow: auto;
    border: 1px solid #ebeef5;
    margin-top: 10px;
    margin-left: 100px;
    min-height: 30px;
  }

  .db_sql_result pre {
    margin: 0;
    padding: 10px;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <kniu-btn :option="{{type:'primary'}}" @click="openCreateTable">新建数据表</kniu-btn>
      <div class="detail_head_actions">
        <kniu-btn @click="doExport">导出数据库</kniu-btn>
        <kniu-btn :option="{{link:true,size:'small',type:'primary'}}" @click="toDatabase">返回</kniu-btn>
      </div>
    </div>

    <div class="detail_wrap">
      <kniu-table :option="{{tableTable}}">
        <kniu-table-col :option="{{width:60,align:'center',fixed:'left',type:'checkbox'}}" />
        <kniu-table-col :option="{{field:'sid',label:'排序',width:90,align:'center',editable:'number',sortable:true,onChange:(updateSort)}}" />
        <kniu-table-col :option="{{field:'id',label:'ID',width:90,align:'center',fixed:'left',sortable:true}}" />
        <kniu-table-col :option="{{field:'name',label:'表名',showOverflowTooltip:true}}" />
        <kniu-table-col :option="{{field:'comment',label:'注释',showOverflowTooltip:true}}" />
        <kniu-table-col :option="{{field:'engine',label:'引擎',width:90,align:'center'}}" />
        <kniu-table-col :option="{{field:'charset',label:'字符集',width:90,align:'center'}}" />
        <kniu-table-col :option="{{field:'collation',label:'排序',width:180,align:'center'}}" />
        <kniu-table-col :option="{{field:'type_text',label:'类型',width:90,align:'center'}}" />
        <kniu-table-col :option="{{field:'rows',label:'行数',width:100,align:'center',sortable:true}}" />
        <kniu-table-col :option="{{field:'size_text',label:'体积',width:100,align:'center'}}" />
        <kniu-table-col :option="{{label:'操作',width:180,align:'center',fixed:'right'}}">
          <template #default>
            <kniu-btn :option="{{type:'primary',size:'small',link:true}}" @click="viewTable">查看</kniu-btn>
          </template>
        </kniu-table-col>
      </kniu-table>
    </div>
  </div>
</section>

<kniu-modal :option="{{show:(showCreateTable),onClose:(closeCreateTable),style:'width:30vw;'}}">
  <template #header>
    <span>新建数据表</span>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input :form="{{sqlModel.sql}}" :option="{{name:'sql',rows:8,placeholder:'CREATE TABLE xxx ();',type:'textarea'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">sql 命令</template>
      </kniu-input>
    </kniu-form-cell>
    <div :if="{{sqlResultText}}" class="db_sql_result">
      <pre>{{sqlResultText}}</pre>
    </div>
  </template>
  <template #footer>
    <kniu-btn @click="closeCreateTable">关 闭</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="submitCreateTable">执 行</kniu-btn>
  </template>
</kniu-modal>
