<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_title {
    font-size: 16px;
    font-weight: 600;
    color: #303133;
  }

  .detail_head_actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail_head_actions kniu-input,
  .detail_head_actions kniu-input-group {
    display: block;
    width: 280px;
    max-width: 100%;
    min-width: 0;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }

  .detail_upload_row {
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr);
    align-items: start;
    width: 100%;
  }

  .detail_upload_label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    border: 1px solid #dcdfe6;
    border-right: 0;
    border-radius: 4px 0 0 4px;
    background-color: #f5f7fa;
    color: #909399;
    box-sizing: border-box;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <span class="detail_title">文章</span>
      <div class="detail_head_actions">
        <kniu-btn kniu:option="{{type:'primary'}}" kniu@click="addRow">添加</kniu-btn>
        <kniu-input kniu:form="{{keyword}}" kniu:option="{{name:'keyword',placeholder:'请输入标题'}}" kniu@keydown.enter="searchList" kniu@input="debouncedSearch">
          <template #append label-width="48px">
            <kniu-btn aria-label="搜索" kniu:option="{{text:true}}" kniu@click="searchList">
              <kniu-icon kniu:option="{{icon:'Search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn kniu:option="{{link:true,type:'primary',size:'small'}}" kniu@click="goBack">返回</kniu-btn>
      </div>
    </div>
    <template kniu:if="{{articleTable.data.length > 0}}">
      <div class="detail_wrap">
        <kniu-table ref="table" kniu:option="{{articleTable}}">
          <kniu-table-col width="60" align="center" fixed="left" type="checkbox" />
          <kniu-table-col field="id" label="ID" width="80" align="center" fixed="left" sortable />
          <kniu-table-col field="sid" label="排序" width="100" align="center" editable="number" fixed="left" sortable />
          <kniu-table-col field="title" label="标题" min-width="360" show-overflow-tooltip />
          <kniu-table-col field="publisher" label="发布者" width="120" align="center" />
          <kniu-table-col field="cover" label="封面" width="180" align="center">
            <template #default>
              <kniu-image kniu:if="{{row.cover}}" style="width:60px;height:60px;" src="{{row.cover}}" />
            </template>
          </kniu-table-col>
          <kniu-table-col field="subtitle" label="副标题" min-width="360" show-overflow-tooltip />
          <kniu-table-col field="summary" label="摘要" min-width="360" show-overflow-tooltip />
          <kniu-table-col field="likes" label="点赞数" width="100" align="center" sortable />
          <kniu-table-col kniu:if="{{canEditContent}}" field="is_show" label="显示" width="120" align="center">
            <template #default>
              <kniu-switch kniu:option="{{switchOptions}}" kniu@change="updateShow" />
            </template>
          </kniu-table-col>
          <kniu-table-col field="create_time" label="创建时间" width="180" align="center" />
          <kniu-table-col kniu:if="{{canEditContent}}" label="操作" width="160" align="center" fixed="right">
            <template #default>
              <kniu-btn kniu:option="{{type:'danger',size:'small',link:true}}" kniu@click="deleteRow">删除</kniu-btn>
              <kniu-btn kniu:option="{{type:'primary',size:'small',link:true}}" kniu@click="editRow">修改</kniu-btn>
            </template>
          </kniu-table-col>
        </kniu-table>
        <kniu-page ref="page" kniu:option="{{articlePage}}" />
      </div>
    </template>
    <template kniu:else>
      <kniu-empty kniu:option="{{note:'暂无数据'}}" />
    </template>
  </div>
</section>
<!-- 弹框 -->
<kniu-modal style="width:90vw;" kniu:option="{{show:(showmodal)}}" kniu@close="closeDialog">
  <template #header>
    <span>{{dialogTitle}}</span>
    <kniu-btn kniu:option="{{type:'primary',size:'small',link:true}}" kniu@click="closeDialog">
      <kniu-icon kniu:option="{{icon:'Close'}}" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.sid}}" kniu:option="{{name:'sid',placeholder:'请输入排序'}}">
        <template #prepend label-width="100px">排序</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.title}}" kniu:option="{{name:'title',placeholder:'请输入标题'}}">
        <template #prepend label-width="100px">标题</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.subtitle}}" kniu:option="{{name:'subtitle',placeholder:'请输入副标题'}}">
        <template #prepend label-width="100px">副标题</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.summary}}" kniu:option="{{name:'summary',placeholder:'请输入摘要',row:'6',type:'textarea'}}">
        <template #prepend label-width="100px">摘要</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input kniu:form="{{editform.url}}" kniu:option="{{name:'url',placeholder:'请输入链接'}}">
        <template #prepend label-width="100px">链接</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-date-picker ref="datepicker" kniu:form="{{editform.create_time}}" kniu:option="{{...(datePickerOptions),name:'create_time'}}">
        <template #prepend label-width="100px">发布时间</template>
      </kniu-date-picker>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-editor ref="editor" kniu:form="{{editform.content}}" kniu:option="{{...(editor),name:'content'}}">
        <template #prepend label-width="100px">正文</template>
      </kniu-editor>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input>
        <template #prepend label-width="100px">封面</template>
        <template #append label-width="100px">
          <kniu-upload ref="upload" kniu:form="{{files}}" kniu:option="{{name:'cover',maxSize:'5',accept:'image/*'}}">选择图片</kniu-upload>
        </template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch kniu:form="{{editform.is_show}}" kniu:option="{{switchOptions}}">
        <template #prepend label-width="100px">显示</template>
      </kniu-switch>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn kniu@click="closeDialog">取 消</kniu-btn>
    <kniu-btn style="margin-left:10px;" kniu:option="{{type:'primary'}}" kniu@click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
