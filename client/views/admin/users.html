<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .detail_head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px 10px;
  }

  .detail_head_actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail_head_actions kniu-input,
  .detail_head_actions kniu-input-group {
    display: block;
    width: 280px;
    max-width: 100%;
    min-width: 0;
  }

  .detail_wrap {
    position: relative;
    background-color: #fff;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <kniu-btn kniu:if="{{canAdministerUsers}}" kniu:options="{{type:'primary'}}" kniu@click="addRow">添加用户</kniu-btn>
      <div class="detail_head_actions">
        <kniu-input kniu:model="{{keyword}}" kniu:options="{{name:'keyword',placeholder:'请输入用户名'}}" kniu@keydown.enter="searchList" kniu@input="debouncedSearch">
          <template #append label-width="48px">
            <kniu-btn aria-label="搜索" kniu:options="{{text:true}}" kniu@click="searchList">
              <kniu-icon kniu:options="{{icon:'Search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
      </div>
    </div>
    <template kniu:if="{{userTable.data.length > 0}}">
      <div class="detail_wrap">
        <kniu-table ref="table" kniu:options="{{userTable}}"></kniu-table>
        <kniu-page kniu:options="{{userPage}}" />
      </div>
    </template>
    <template kniu:else>
      <kniu-empty kniu:options="{{note:'暂无数据'}}" />
    </template>
  </div>
</section>
<!-- 模态框 -->
<kniu-modal style="width:520px;" kniu:options="{{show:(showmodal)}}" kniu@close="closeDialog">
  <template #header>
    <span>{{dialogTitle}}</span>
    <kniu-btn kniu:options="{{link:true,type:'primary',size:'small'}}" kniu@click="closeDialog">
      <kniu-icon kniu:options="{{icon:'Close'}}" />
    </kniu-btn>
  </template>
  <template #default>
    <kniu-form ref="userform" kniu:options="{{userModel}}">
      <kniu-form-cell kniu:if="{{canAdministerUsers}}">
        <kniu-input kniu:model="{{userModel.name}}" kniu:options="{{name:'name',placeholder:'请输入用户名'}}">
          <template #prepend label-width="120px">用户名</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{!isAddDialog}}">
        <kniu-input kniu:model="{{userModel.old_password}}" kniu:options="{{name:'old_password',type:'password',showPassword:true,placeholder:'请输入原密码'}}">
          <template #prepend label-width="120px">原密码</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{isAddDialog || canAdministerUsers}}">
        <kniu-input kniu:model="{{userModel.password}}" kniu:options="{{name:'password',type:'password',showPassword:true,placeholder:'8位以上，含大小写、数字、特殊字符'}}">
          <template #prepend label-width="120px">{{isAddDialog ? '密码' : '新密码'}}</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{isAddDialog || canAdministerUsers}}">
        <kniu-input kniu:model="{{userModel.repassword}}" kniu:options="{{name:'repassword',type:'password',showPassword:true,placeholder:'请再次输入密码'}}">
          <template #prepend label-width="120px">{{isAddDialog ? '确认密码' : '确认新密码'}}</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{!canAdministerUsers}}">
        <kniu-input kniu:model="{{userModel.new_password}}" kniu:options="{{name:'new_password',type:'password',showPassword:true,placeholder:'请输入新密码'}}">
          <template #prepend label-width="120px">新密码</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{!canAdministerUsers}}">
        <kniu-input kniu:model="{{userModel.confirm_password}}" kniu:options="{{name:'confirm_password',type:'password',showPassword:true,placeholder:'请再次输入新密码'}}">
          <template #prepend label-width="120px">确认新密码</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{canAdministerUsers}}">
        <template #prepend label-width="120px">角色</template>
        <template #append>
          <kniu-radio-group kniu:model="{{userModel.role}}" kniu@change="onRoleChange">
            <kniu-radio kniu:options="{{value:'1',size:'large'}}">管理员</kniu-radio>
            <kniu-radio kniu:options="{{value:'2',size:'large'}}">普通用户</kniu-radio>
          </kniu-radio-group>
        </template>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{canAdministerUsers}}">
        <kniu-input kniu:model="{{userModel.sid}}" kniu:options="{{name:'sid',placeholder:'请输入排序'}}">
          <template #prepend label-width="120px">排序</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell kniu:if="{{canAdministerUsers}}">
        <kniu-switch kniu:model="{{userModel.is_show}}" kniu:options="{{userSwitch}}">
          <template #prepend label-width="120px">显示</template>
        </kniu-switch>
      </kniu-form-cell>
    </kniu-form>
  </template>
  <template #footer>
    <kniu-btn kniu@click="closeDialog">取 消</kniu-btn>
    <kniu-btn style="margin-left:10px;" kniu:options="{{type:'primary'}}" kniu@click="saveEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
