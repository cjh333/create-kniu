<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_all.min.css");

  .feedback_detail {
    display: grid;
    gap: 14px;
    padding: 4px 2px;
  }

  .feedback_detail_label {
    margin: 0 0 6px;
    font-size: 13px;
    color: #909399;
  }

  .feedback_detail_value {
    margin: 0;
    font-size: 14px;
    color: #303133;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .feedback_detail_images {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .feedback_detail_image {
    width: max(64px, calc(96 / var(--kniu_vw)));
    height: max(64px, calc(96 / var(--kniu_vw)));
    margin-right: calc(8 / var(--kniu_vw));
    border-radius: calc(4 / var(--kniu_vw));
    -webkit-border-radius: calc(4 / var(--kniu_vw));
    -moz-border-radius: calc(4 / var(--kniu_vw));
    -ms-border-radius: calc(4 / var(--kniu_vw));
    -o-border-radius: calc(4 / var(--kniu_vw));
    background-color: #f5f7fa;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <div class="detail_head_actions">
        <kniu-input :form="{{keyword}}" :option="{{name:'keyword',placeholder:'请输入昵称、标题或简述'}}" @keydown.enter="searchList" @input="debouncedSearch">
          <template #append :option="{{labelWidth:'48px'}}">
            <kniu-btn :option="{{text:true,ariaLabel:'搜索'}}" @click="searchList">
              <kniu-icon :option="{{icon:'search'}}" />
            </kniu-btn>
          </template>
        </kniu-input>
        <kniu-btn :option="{{link:true,type:'primary'}}" @click="goBack">返回</kniu-btn>
      </div>
    </div>
    <template :if="{{feedbackTable.data.length > 0}}">
      <div class="detail_wrap">
        <kniu-table ref="table" :option="{{feedbackTable}}">
          <kniu-table-col :option="{{width:60,align:'center',fixed:'left',type:'checkbox'}}" />
          <kniu-table-col :option="{{field:'sid',label:'排序',width:90,align:'center',editable:'number',sortable:true,onChange:(updateSort)}}" />
          <kniu-table-col :option="{{field:'id',label:'ID',width:90,align:'center',fixed:'left',sortable:true}}" />
          <kniu-table-col :option="{{field:'account_name',label:'账号',width:100,align:'center',showOverflowTooltip:true}}" />
          <kniu-table-col :option="{{field:'nickname',label:'昵称',width:100,align:'center',showOverflowTooltip:true}}" />
          <kniu-table-col :option="{{field:'title',label:'标题',showOverflowTooltip:true}}" />
          <kniu-table-col :option="{{field:'status_text',label:'状态',width:100,align:'center'}}">
            <template #default>
              <kniu-tag type="{{scope.row.status_type}}"></kniu-tag>
            </template>
          </kniu-table-col>
          <kniu-table-col :option="{{field:'create_time',label:'提交时间',width:180,align:'center',sortable:true}}" />
          <kniu-table-col :option="{{field:'id',label:'操作',width:100,align:'center',fixed:'right'}}">
            <template #default>
              <kniu-btn :option="{{type:'primary',size:'small',link:true}}" @click="openFeedback">查看</kniu-btn>
            </template>
          </kniu-table-col>
        </kniu-table>
        <kniu-page ref="page" :option="{{feedbackPage}}" />
      </div>
    </template>
    <template :else>
      <kniu-empty :option="{{note:'暂无数据'}}" />
    </template>
  </div>
  <kniu-modal :option="{{show:(feedbackDetail.show),onClose:(closeFeedbackDialog),style:'width:min(600px,92vw)'}}">
    <template #header>
      <span>反馈详情</span>
    </template>
    <template #default>
      <div class="feedback_detail">
        <div class="feedback_detail_item">
          <p class="feedback_detail_label">提交人</p>
          <p class="feedback_detail_value">{{feedbackDetail.nickname}}</p>
        </div>
        <div class="feedback_detail_item">
          <p class="feedback_detail_label">问题标题</p>
          <p class="feedback_detail_value">{{feedbackDetail.title}}</p>
        </div>
        <div class="feedback_detail_item">
          <p class="feedback_detail_label">提交时间</p>
          <p class="feedback_detail_value">{{feedbackDetail.create_time}}</p>
        </div>
        <div class="feedback_detail_item">
          <p class="feedback_detail_label">问题简述</p>
          <p class="feedback_detail_value">{{feedbackDetail.content}}</p>
        </div>
        <div class="feedback_detail_item" :if="{{feedbackDetail.imageList.length > 0}}">
          <p class="feedback_detail_label">问题图片</p>
          <div class="feedback_detail_value feedback_detail_images">
            <img class="feedback_detail_image" :for="{{feedbackDetail.imageList}}" :for-item="img" :key="*this" src="{{img}}">
          </div>
        </div>
        <kniu-form-cell>
          <kniu-input :form="{{feedbackDetail.result}}" :option="{{name:'result',rows:4,maxlength:2000,placeholder:'请输入反馈结果（保存后前台以红字展示）',type:'textarea'}}">
            <template #prepend :option="{{labelWidth:'80px'}}">反馈结果</template>
          </kniu-input>
        </kniu-form-cell>
      </div>
    </template>
    <template #footer>
      <kniu-btn @click="closeFeedbackDialog">取 消</kniu-btn>
      <kniu-btn :option="{{type:'primary'}}" @click="saveFeedbackResult">保存结果</kniu-btn>
    </template>
  </kniu-modal>
</section>
