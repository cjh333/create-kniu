<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/admin/admin.min.css");
  @import url("@style/admin/admin_home.min.css");

  .index_cell2 {
    background-color: #fff;
  }
</style>
<section class="seo_cells">
  <div class="admin_content_body index_cell index_cell2">
    <kniu-form kniu@submit.prevent="onSubmit" ref="form" model="{{seoform}}" rules="{{rules}}">
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.title}}" name="title" placeholder="请输入网站名称">
          <template #prepend label-width="120px">网站名称</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.url}}" name="url" placeholder="请输入网站域名">
          <template #prepend label-width="120px">网站域名</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;">
          <template #prepend label-width="120px">logo</template>
          <template #append label-width="120px">
            <kniu-upload ref="upload" kniu:model="{{files}}" name="logo" max-size="5" accept=".ico,image/x-icon,image/vnd.microsoft.icon,image/png,image/gif">选择logo</kniu-upload>
          </template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.description}}" name="description" placeholder="请输入description描述" row="3" type="textarea">
          <template #prepend label-width="120px">description</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.keywords}}" name="keywords" placeholder="请输入keywords关键词">
          <template #prepend label-width="120px">keywords</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.author}}" name="author" placeholder="请输入author作者">
          <template #prepend label-width="120px">author</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.copyright}}" name="copyright" placeholder="请输入版权">
          <template #prepend label-width="120px">copyright</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.record}}" name="record" placeholder="请输入备案号">
          <template #prepend label-width="120px">record</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-input style="max-width: 600px;" kniu:model="{{seoform.email}}" name="email" placeholder="请输入邮箱">
          <template #prepend label-width="120px">email</template>
        </kniu-input>
      </kniu-form-cell>
      <kniu-form-cell>
        <kniu-btn style="margin-left: 120px;" disabled="{{isSubmitting}}" native-type="submit">
          <kniu-icon kniu:if="{{isSubmitting}}" icon="Loading" />
          <template kniu:else>提 交</template>
        </kniu-btn>
      </kniu-form-cell>
    </kniu-form>
  </div>
</section>
