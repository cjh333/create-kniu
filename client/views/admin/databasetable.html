<style scoped>
  @import url("@kniu/kniu.min.css");
  @import url("@style/web.min.css");
  @import url("@style/admin/admin_all.min.css");

  .detail_wrap {
    margin-bottom: 16px;
  }

  .detail_head>.detail_head_actions {
    margin-left: auto;
  }

  .db_section_search {
    flex: 0 0 auto;
    width: 320px;
    max-width: 46%;
    min-width: 160px;
  }
</style>
<section class="index_cells">
  <div class="admin_content_body index_cell index_cell_2">
    <div class="detail_head">
      <kniu-tab-head :option="{{for:'dbTabBody',active:'data',data:[{name:'data',label:'数据'},{name:'struct',label:'属性'}]}}" />
      <div class="detail_head_actions">
        <kniu-btn :option="{{type:'danger'}}" @click="dropTable">删除数据表</kniu-btn>
        <kniu-btn :option="{{link:true,type:'primary'}}" @click="toTables">返回</kniu-btn>
      </div>
    </div>
    <kniu-tab-body id="dbTabBody">
      <kniu-tab-panel>
        <div class="detail_head">
          <span class="db_section_title">数据行 共 {{total}} 行</span>
          <div class="detail_head_actions">
            <kniu-btn :option="{{type:'primary'}}" @click="openInsertRow">新增行</kniu-btn>
            <kniu-input class="db_section_search" :form="{{keyword}}" @keydown.enter="searchList" @input="debouncedSearch" :option="{{name:'keyword',placeholder:'按任意列模糊检索',clearable:true}}">
              <template #append :option="{{labelWidth:'48px'}}">
                <kniu-btn :option="{{text:true,ariaLabel:'搜索'}}" @click="searchList">
                  <kniu-icon :option="{{icon:'search'}}" />
                </kniu-btn>
              </template>
            </kniu-input>
          </div>
        </div>
        <div class="detail_wrap">
          <kniu-table :option="{{rowTable}}">
            <kniu-table-col :option="{{label:'操作',width:160,align:'center',fixed:'right'}}" data-db-action>
              <template #default>
                <kniu-btn :option="{{type:'danger',size:'small',link:true}}" @click="deleteRow">删除</kniu-btn>
                <kniu-btn :option="{{type:'primary',size:'small',link:true}}" @click="openEditRow">编辑</kniu-btn>
              </template>
            </kniu-table-col>
          </kniu-table>
          <kniu-page :option="{{rowPage}}" />
        </div>
      </kniu-tab-panel>
      <kniu-tab-panel>
        <div class="detail_wrap">
          <kniu-table :option="{{structTable}}">
            <kniu-table-col :option="{{field:'name',label:'名称',width:130,align:'center',showOverflowTooltip:true}}" />
            <kniu-table-col :option="{{field:'type_text',label:'类型',width:130,align:'center',showOverflowTooltip:true}}" />
            <kniu-table-col :option="{{field:'length_text',label:'长度',width:130,align:'center',showOverflowTooltip:true}}" />
            <kniu-table-col :option="{{field:'comment',label:'注释',width:130,align:'center',showOverflowTooltip:true}}" />
            <kniu-table-col :option="{{field:'default_text',label:'默认值',width:180,align:'center',showOverflowTooltip:true}}" />
            <kniu-table-col :option="{{field:'not_null',label:'Not Null',width:90,align:'center'}}" />
            <kniu-table-col :option="{{field:'is_primary',label:'主键',width:80,align:'center'}}" />
            <kniu-table-col :option="{{field:'is_unique',label:'唯一',width:80,align:'center'}}" />
            <kniu-table-col :option="{{field:'is_auto',label:'自增',width:80,align:'center'}}" />
            <kniu-table-col :option="{{field:'is_unsigned',label:'UNSIGNED',width:100,align:'center'}}" />
            <kniu-table-col :option="{{field:'is_zerofill',label:'Zerofill',width:100,align:'center'}}" />
            <kniu-table-col :option="{{label:'操作',width:160,align:'center',fixed:'right'}}" data-db-action>
              <template #default>
                <kniu-btn :option="{{type:'danger',size:'small',link:true}}" @click="dropColumn">删除</kniu-btn>
                <kniu-btn :option="{{type:'primary',size:'small',link:true}}" @click="openColumnEdit">编辑</kniu-btn>
              </template>
            </kniu-table-col>
          </kniu-table>
        </div>
      </kniu-tab-panel>
    </kniu-tab-body>
  </div>
</section>
<!-- 数据-编辑 -->
<kniu-modal :option="{{show:(showRowEditor),onClose:(closeRowEditor),minmax:true,style:'width:60vw;'}}">
  <template #header>
    <span>{{rowEditorTitle}}</span>
  </template>
  <template #default>
    <div style="overflow:auto;min-height:360px;">
      <template :for="{{rowFields}}" :for-item="f">
        <kniu-form-cell>
          <kniu-editor :if="{{f.editor}}" :form="{{f.value}}" :option="{{name:f.name,type:f.editor,placeholder:'留空写入 NULL · ' + f.name}}">
            <template #prepend :option="{{labelWidth:'100px'}}">{{f.name}}</template>
          </kniu-editor>
          <kniu-date-picker :elseif="{{f.picker}}" :form="{{f.value}}" :option="{{type:f.picker,name:f.name}}">
            <template #prepend :option="{{labelWidth:'100px'}}">{{f.name}}</template>
          </kniu-date-picker>
          <kniu-input :else :form="{{f.value}}" :option="{{type:f.type,name:f.name,placeholder:'留空写入 NULL · ' + f.name}}">
            <template #prepend :option="{{labelWidth:'100px'}}">{{f.name}}</template>
          </kniu-input>
        </kniu-form-cell>
      </template>
      <template :if="{{rowFields.length === 0}}">
        <kniu-form-cell>
          <p style="margin-left:100px;font-size:12px;color:#909399;">该表没有可编辑的字段。</p>
        </kniu-form-cell>
      </template>
    </div>
    <kniu-form-cell style="margin-top:20px;">
      <kniu-switch :form="{{emptyAsNull}}" :option="{{name:'emptyAsNull',activeValue:true,inactiveValue:false}}">
        <template #prepend :option="{{labelWidth:'100px'}}">空值处理</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <p style="margin-left:100px;font-size:12px;color:#909399;">留空按 NULL 写入（关闭则写入空字符串）</p>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn @click="closeRowEditor">取 消</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="submitRow">保 存</kniu-btn>
  </template>
</kniu-modal>
<!-- 属性-编辑 -->
<kniu-modal :option="{{show:(showColumnEditor),onClose:(closeColumnEditor),style:'width:60vw;'}}">
  <template #header>
    <span>{{columnEditorTitle}}</span>
  </template>
  <template #default>
    <kniu-form-cell>
      <kniu-input :form="{{columnForm.name}}" :option="{{name:'name',placeholder:'列名（字母、数字、下划线）'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">名称</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <template #prepend label-width="100px">类型</template>
      <kniu-select :form="{{columnForm.type}}" :option="{{name:'type',placeholder:'选择列类型'}}">
        <kniu-option value="tinyint">tinyint</kniu-option>
        <kniu-option value="smallint">smallint</kniu-option>
        <kniu-option value="mediumint">mediumint</kniu-option>
        <kniu-option value="int">int</kniu-option>
        <kniu-option value="bigint">bigint</kniu-option>
        <kniu-option value="decimal">decimal</kniu-option>
        <kniu-option value="float">float</kniu-option>
        <kniu-option value="double">double</kniu-option>
        <kniu-option value="char">char</kniu-option>
        <kniu-option value="varchar">varchar</kniu-option>
        <kniu-option value="tinytext">tinytext</kniu-option>
        <kniu-option value="text">text</kniu-option>
        <kniu-option value="mediumtext">mediumtext</kniu-option>
        <kniu-option value="longtext">longtext</kniu-option>
        <kniu-option value="date">date</kniu-option>
        <kniu-option value="datetime">datetime</kniu-option>
        <kniu-option value="timestamp">timestamp</kniu-option>
        <kniu-option value="time">time</kniu-option>
        <kniu-option value="year">year</kniu-option>
        <kniu-option value="json">json</kniu-option>
        <kniu-option value="blob">blob</kniu-option>
      </kniu-select>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{columnForm.length}}" :option="{{name:'length',placeholder:'可留空，如 255 或 10,2'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">长度</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{columnForm.comment}}" :option="{{name:'comment',placeholder:'列注释'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">注释</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-input :form="{{columnForm.default}}" :option="{{name:'default',placeholder:'留空清除默认值'}}">
        <template #prepend :option="{{labelWidth:'100px'}}">默认值</template>
      </kniu-input>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{columnForm.notNull}}" :option="{{name:'notNull',activeValue:true,inactiveValue:false}}">
        <template #prepend :option="{{labelWidth:'100px'}}">Not Null</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{columnForm.primaryKey}}" :option="{{name:'primaryKey',activeValue:true,inactiveValue:false,disabled:true}}">
        <template #prepend :option="{{labelWidth:'100px'}}">主键</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{columnForm.unique}}" :option="{{name:'unique',activeValue:true,inactiveValue:false,disabled:true}}">
        <template #prepend :option="{{labelWidth:'100px'}}">唯一</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{columnForm.autoInc}}" :option="{{name:'autoInc',activeValue:true,inactiveValue:false}}">
        <template #prepend :option="{{labelWidth:'100px'}}">自增</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{columnForm.unsigned}}" :option="{{name:'unsigned',activeValue:true,inactiveValue:false}}">
        <template #prepend :option="{{labelWidth:'100px'}}">UNSIGNED</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <kniu-switch :form="{{columnForm.zerofill}}" :option="{{name:'zerofill',activeValue:true,inactiveValue:false}}">
        <template #prepend :option="{{labelWidth:'100px'}}">Zerofill</template>
      </kniu-switch>
    </kniu-form-cell>
    <kniu-form-cell>
      <p style="margin-left:100px;font-size:12px;color:#909399;">默认值留空表示清除；输入 NULL 表示默认空值；CURRENT_TIMESTAMP 按时间字面量写入。编辑是全量重定义，ON UPDATE 等未开放属性会被清除。</p>
    </kniu-form-cell>
  </template>
  <template #footer>
    <kniu-btn @click="closeColumnEditor">取 消</kniu-btn>
    <kniu-btn :option="{{type:'primary'}}" @click="submitColumnEdit">保 存</kniu-btn>
  </template>
</kniu-modal>
