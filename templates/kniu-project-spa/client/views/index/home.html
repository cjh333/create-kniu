<include src="./common/navigation.html" />
<section class="kniu-app-card">
  <include src="./common/header.html" />

  <div class="home-hero">
    <h1>Kniu Project SPA</h1>
    <p>原生 ESM、零运行时依赖的路由与模板引擎示例</p>
    <div class="home-hero-actions">
      <kniu-btn @click="openAbout" type="primary">JavaScript 跳转关于页面</kniu-btn>
      <a href="#/about/{{visits || 1}}">跳转到关于页面 →</a>
    </div>
    <div class="home-features">
      <template :for="{{features}}" :for-item="feature" :for-index="x" :key="*this">
        <span class="home-feature"><b>{{x}}</b>{{feature}}</span>
      </template>
    </div>
  </div>

  <div class="home-section">
    <h2 class="home-section-title">通用 UI 组件</h2>
    <p class="home-section-note">内置组件按需自动加载；自定义组件只能放在 <code>client/custom</code>，由 Core 自动加载。</p>
    <div class="home-grid">
      <div class="home-grid-card">
        <strong>kniu-tag</strong>
        <kniu-tag type="success">组件可按需自动加载</kniu-tag>
      </div>
      <div class="home-grid-card">
        <strong>kniu-badge</strong>
        <kniu-badge value="8"><button type="button">通知</button></kniu-badge>
      </div>
      <div class="home-grid-card">
        <strong>kniu-status</strong>
        <kniu-status type="success">服务正常</kniu-status>
      </div>
      <div class="home-grid-card">
        <strong>kniu-empty</strong>
        <kniu-empty note="这里还没有内容"></kniu-empty>
      </div>
      <div class="home-grid-card">
        <strong>app-rating</strong>
        <app-rating value="{{rating}}" @change="onRate" aria-label="评分"></app-rating>
      </div>
    </div>
  </div>

  <div class="home-section">
    <h2 class="home-section-title">交互演示</h2>
    <div class="home-demo">
      <div class="home-demo-card">
        <strong>点击计数</strong>
        <span class="home-count">{{visits}}</span>
        <kniu-btn @click.stop="increment" type="primary">增加次数</kniu-btn>
      </div>
      <div class="home-demo-card">
        <strong>双向表单绑定</strong>
        <input :form="{{search}}" placeholder="输入任意内容试试" type="text">
        <p>当前搜索内容：{{search}}</p>
        <template :if="{{visits}}">
          <p class="home-hint">已开始交互。</p>
        </template>
      </div>
    </div>
  </div>

  <div class="home-section">
    <h2 class="home-section-title">九九乘法表</h2>
    <div class="home-table">
      <template :for="{{multiplication}}" :for-item="row" :key="*this">
        <div class="home-table-row">
          <template :for="{{row}}" :for-item="cell" :key="cell.result">
            <span class="home-table-cell">{{cell.left}} × {{cell.right}} = {{cell.result}}</span>
          </template>
        </div>
      </template>
    </div>
  </div>

  <include src="./common/footer.html" />
</section>
