<div class="kniu_sys_comment_input_area kniu_sys_comment_inline_area" data-input-area="{{input-area}}">
  <div class="kniu_sys_comment_reply_hint" data-reply-hint hidden>
    <span data-reply-name></span>
    <button data-reply-cancel aria-label="取消回复" type="button">×</button>
  </div>
  <div class="kniu_sys_comment_textarea_wrap">
    <textarea class="kniu_sys_comment_textarea" aria-autocomplete="none" placeholder="" autocomplete="off"></textarea>
    <span class="kniu_sys_comment_count" data-count hidden>0/0</span>
  </div>
  <div class="kniu_sys_comment_toolbar">
    <button class="kniu_sys_comment_emoji_btn" data-emoji-btn aria-label="表情" type="button">😊</button>
    <button class="kniu_sys_comment_submit" disabled type="button"></button>
  </div>
  <div class="kniu_sys_comment_emoji_panel kniu_sys_dropdown_panel kniu_sys_comment_hidden" data-emoji-panel></div>
</div>
