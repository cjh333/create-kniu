<div class="kniu_sys_comment_item{{own-class}}" data-id="{{item-id}}">
  <div class="kniu_sys_comment_avatar" {{user-id-attr}}>{{avatar-html}}</div>
  <div class="kniu_sys_comment_body">
    <div class="kniu_sys_comment_meta">
      <span class="kniu_sys_comment_username" {{user-id-attr}}>{{username-html}}</span>
      <span class="kniu_sys_comment_time">{{time-html}}</span>
      {{action-html}}
    </div>
    <div class="kniu_sys_comment_content">{{content-html}}</div>
    <div class="kniu_sys_comment_inline_slot" data-inline-slot></div>
  </div>
</div>
