<section class="kniu_sys_date_picker_range_pane" data-range-pane="left">
  <div class="kniu_sys_date_picker_range_head">
    <button type="button" data-range-action="prev-year">«</button>
    <button type="button" data-range-action="prev-month">‹</button>
    <div class="kniu_sys_date_picker_range_title">
      <button type="button" data-range-choose="year"></button>
      <button type="button" data-range-choose="month"></button>
    </div>
    <span></span>
    <span></span>
  </div>
  <div class="kniu_sys_date_picker_range_week"></div>
  <div class="kniu_sys_date_picker_range_days"></div>
  <div class="kniu_sys_date_picker_range_chooser" hidden></div>
</section>
<section class="kniu_sys_date_picker_range_pane" data-range-pane="right">
  <div class="kniu_sys_date_picker_range_head">
    <span></span>
    <span></span>
    <div class="kniu_sys_date_picker_range_title">
      <button type="button" data-range-choose="year"></button>
      <button type="button" data-range-choose="month"></button>
    </div>
    <button type="button" data-range-action="next-month">›</button>
    <button type="button" data-range-action="next-year">»</button>
  </div>
  <div class="kniu_sys_date_picker_range_week"></div>
  <div class="kniu_sys_date_picker_range_days"></div>
  <div class="kniu_sys_date_picker_range_chooser" hidden></div>
</section>
