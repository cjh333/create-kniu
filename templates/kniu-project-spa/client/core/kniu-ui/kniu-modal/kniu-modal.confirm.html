<div class="kniu_sys_modal_wrap">
  <div class="kniu_sys_modal_mask" part="mask"></div>
  <div class="kniu_sys_modal_dialog" part="dialog">
    <div class="kniu_sys_modal_header">
      <h4 class="kniu_sys_modal_confirm_title"></h4>
      <button class="kniu_sys_modal_close" aria-label="关闭" type="button">
        <kniu-icon icon="close"></kniu-icon>
      </button>
    </div>
    <div class="kniu_sys_modal_body">
      <span class="kniu_sys_modal_confirm_icon"></span>
      <div class="kniu_sys_modal_confirm_message"></div>
    </div>
    <div class="kniu_sys_modal_footer">
      <kniu-btn class="kniu_sys_modal_cancel">取消</kniu-btn>
      <kniu-btn class="kniu_sys_modal_confirm" type="primary">确定</kniu-btn>
    </div>
  </div>
</div>
