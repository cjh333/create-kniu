<div class="kniu_sys_switch_group" data-affix="false" data-has-prepend="false" data-has-append="false">
  <span class="kniu_sys_switch_affix kniu_sys_switch_prepend">
    <slot name="prepend"></slot>
  </span>
  <div class="kniu_sys_switch_content">
    <label class="kniu_sys_switch" data-active="false" data-disabled="false">
      <span class="kniu_sys_switch_text kniu_sys_switch_inactive_text"></span>
      <input class="kniu_sys_switch_input" type="checkbox">
      <button class="kniu_sys_switch_core" type="button">
        <span class="kniu_sys_switch_button"></span>
        <i class="kniu_sys_switch_icon"></i>
      </button>
      <span class="kniu_sys_switch_text kniu_sys_switch_active_text"></span>
    </label>
  </div>
  <span class="kniu_sys_switch_affix kniu_sys_switch_append">
    <slot name="append"></slot>
  </span>
</div>
