<section class="kniu_sys_date_picker_range_pane" data-range-pane="left">
  <div class="kniu_sys_date_picker_range_head">
    <button data-range-action="prev-year" type="button">«</button>
    <button data-range-action="prev-month" type="button">‹</button>
    <div class="kniu_sys_date_picker_range_title">
      <button data-range-choose="year" type="button"></button>
      <button data-range-choose="month" type="button"></button>
    </div>
    <span></span>
    <span></span>
  </div>
  <div class="kniu_sys_date_picker_range_week"></div>
  <div class="kniu_sys_date_picker_range_days"></div>
  <div class="kniu_sys_date_picker_range_chooser" hidden></div>
</section>
<section class="kniu_sys_date_picker_range_pane" data-range-pane="right">
  <div class="kniu_sys_date_picker_range_head">
    <span></span>
    <span></span>
    <div class="kniu_sys_date_picker_range_title">
      <button data-range-choose="year" type="button"></button>
      <button data-range-choose="month" type="button"></button>
    </div>
    <button data-range-action="next-month" type="button">›</button>
    <button data-range-action="next-year" type="button">»</button>
  </div>
  <div class="kniu_sys_date_picker_range_week"></div>
  <div class="kniu_sys_date_picker_range_days"></div>
  <div class="kniu_sys_date_picker_range_chooser" hidden></div>
</section>
